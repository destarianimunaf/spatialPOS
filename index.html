// Deterministic 13-digit barcode generated from a product id, so every
// product always carries the same code across Penjualan, Stok, Produk, and Barcode.
function genBarcode(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  const digits = String(899000000000 + (hash % 999999999)).padStart(13, "0").slice(0, 13);
  return digits;
}

// Short two-tone "cring!" cash-register chime played on successful checkout.
// Synthesized with Web Audio API so no external audio file/asset is needed.
function playCashSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    [1568, 2093].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = now + i * 0.08;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.25, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
      osc.start(start);
      osc.stop(start + 0.5);
    });
    setTimeout(() => ctx.close(), 900);
  } catch (err) {
    console.warn("Gagal memutar suara notifikasi:", err);
  }
}

// Bright single-note "tring!" bell — played when a customer browsing in Mode
// Pelanggan hands their order back to the cashier. Synthesized (no audio
// file needed) with a fundamental tone plus a quiet octave-up overtone so it
// reads as a crisp service-bell "ding" rather than a flat beep.
function playTringSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    [[2100, 0.28, 0.55], [4200, 0.10, 0.35]].forEach(([freq, peak, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(peak, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.start(now);
      osc.stop(now + dur);
    });
    setTimeout(() => ctx.close(), 900);
  } catch (err) {
    console.warn("Gagal memutar suara notifikasi:", err);
  }
}

// Reads an <input type="file"> image, downsizes it on a canvas, and resolves
// a JPEG data URL. Keeps product photos light — fast to render in the UI and
// cheap to keep in localStorage — instead of storing the original file as-is.
function fileToResizedDataURL(file, maxDim = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error("Gagal membaca file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Gagal memuat gambar"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx2d = canvas.getContext("2d");
        ctx2d.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Small hook that keeps a piece of state in sync with localStorage, so the
// whole app (products, transactions, members, suppliers, settings) survives
// refreshes and logins/logouts without a backend.
function useLocalStorageState(key, initialValue) {
  const [state, setState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : initialValue;
    } catch (err) {
      console.warn("Gagal membaca localStorage:", key, err);
      return initialValue;
    }
  });
  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(state));
    } catch (err) {
      console.warn("Gagal menyimpan localStorage:", key, err);
    }
  }, [key, state]);
  return [state, setState];
}

// Accounts (store subscriptions + login credentials) need to be readable
// from LoginPage/RegisterPage, which render before DashboardPage (and its
// useLocalStorageState copy of "jawara_accounts") ever mounts. These talk to
// the same localStorage key directly so a freshly registered account can log
// in immediately.
const ACCOUNTS_KEY = "jawara_accounts";
function readAccounts() {
  try {
    const raw = window.localStorage.getItem(ACCOUNTS_KEY);
    return raw !== null ? JSON.parse(raw) : initialAccounts;
  } catch (err) {
    console.warn("Gagal membaca akun:", err);
    return initialAccounts;
  }
}
function writeAccounts(accounts) {
  try {
    window.localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
  } catch (err) {
    console.warn("Gagal menyimpan akun:", err);
  }
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
// An account can actually log in if it's Aktif or still on Trial, and its
// subscription hasn't passed its expiry date.
function isAccountUsable(acc) {
  if (!acc) return false;
  if (acc.status === "Nonaktif") return false;
  if (acc.expiresAt && acc.expiresAt < todayStr()) return false;
  return true;
}

function LoginPage({ onLogin, onBack, onGoRegister, settings, prefillEmail }) {
  const [selectedRole, setSelectedRole] = useState("admin");
  const [email, setEmail] = useState(prefillEmail || "");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");

  const pickRole = (roleKey) => {
    setSelectedRole(roleKey);
    setError("");
  };

  // Fills in a working demo login for the currently-selected role — the
  // Pro-plan, Aktif "Toko Sumber Rejeki" account — so reviewers can try the
  // real auth flow without having to register first.
  const fillDemo = () => {
    if (selectedRole === "superadmin") {
      setEmail(SUPERADMIN_CREDENTIAL.email);
      setPassword(SUPERADMIN_CREDENTIAL.password);
    } else {
      const demoAccount = readAccounts().find((a) => a.id === "A1");
      setEmail(selectedRole === "kasir" ? demoAccount.kasirEmail : demoAccount.email);
      setPassword(selectedRole === "kasir" ? demoAccount.kasirPassword : demoAccount.password);
    }
    setError("");
  };

  const submit = (e) => {
    e.preventDefault();
    setError("");
    const typedEmail = email.trim().toLowerCase();
    if (!typedEmail || !password) {
      setError("Isi email dan kata sandi terlebih dahulu.");
      return;
    }

    // Super Admin runs the JAWARA platform itself, so it isn't gated by any
    // store's subscription — it's checked against a fixed platform login.
    if (selectedRole === "superadmin") {
      if (typedEmail === SUPERADMIN_CREDENTIAL.email && password === SUPERADMIN_CREDENTIAL.password) {
        onLogin("superadmin", null);
      } else {
        setError("Email atau kata sandi Super Admin salah.");
      }
      return;
    }

    // Admin/Kasir must match a real store account, and that account's
    // JAWARA subscription must actually be paid for (Aktif) or on Trial.
    const accounts = readAccounts();
    const acc = accounts.find((a) => {
      const accEmail = selectedRole === "kasir" ? a.kasirEmail : a.email;
      return (accEmail || "").toLowerCase() === typedEmail;
    });
    if (!acc) {
      setError("Akun tidak ditemukan. Toko Anda belum berlangganan JAWARA — silakan daftar dulu.");
      return;
    }
    const accPassword = selectedRole === "kasir" ? acc.kasirPassword : acc.password;
    if (accPassword !== password) {
      setError("Kata sandi salah.");
      return;
    }
    if (acc.status === "Nonaktif") {
      setError(`Langganan JAWARA untuk "${acc.storeName}" nonaktif. Hubungi Super Admin untuk mengaktifkan kembali.`);
      return;
    }
    if (acc.expiresAt && acc.expiresAt < todayStr()) {
      setError(`Langganan JAWARA untuk "${acc.storeName}" berakhir pada ${acc.expiresAt}. Perpanjang paket untuk bisa masuk lagi.`);
      return;
    }
    onLogin(selectedRole, acc);
  };

  return (
    <div className="min-h-screen bg-ink flex items-center justify-center p-5 relative overflow-hidden">
      <div className="absolute -top-24 -left-24 w-72 h-72 rounded-full bg-[#D5451B]/20 blur-3xl" />
      <div className="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-[#F0A202]/15 blur-3xl" />

      <div className="w-full max-w-md bg-nota-paper rounded-3xl shadow-2xl p-8 relative border border-white/10">
        <button onClick={onBack} className="inline-flex items-center gap-1.5 font-mono-nota text-xs font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-900/5 border border-stone-900/15 rounded-full px-3 py-1.5 mb-6 transition-colors">
          <ArrowLeft className="w-3.5 h-3.5" /> Kembali ke Beranda
        </button>
        <div className="mb-6"><Logo logoUrl={settings.logoUrl} /></div>
        <h1 className="font-display text-2xl uppercase text-stone-900 mb-1">Masuk ke Akun Anda</h1>
        <p className="text-sm text-stone-500 mb-5">Khusus toko yang sudah berlangganan JAWARA. Pilih peran, lalu masuk dengan email &amp; kata sandi akun Anda.</p>

        <div className="grid grid-cols-3 gap-2 mb-5">
          {Object.values(ROLES).map((r) => (
            <button
              type="button"
              key={r.key}
              onClick={() => pickRole(r.key)}
              className={`flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-center transition-colors ${
                selectedRole === r.key
                  ? "border-[#D5451B] bg-[#D5451B]/10"
                  : "border-stone-900/10 bg-white hover:border-stone-900/25"
              }`}
            >
              {r.key === "superadmin" ? <Crown className="w-4 h-4 text-stone-700" /> : <User className="w-4 h-4 text-stone-700" />}
              <span className="font-mono-nota text-[11px] font-semibold text-stone-800 leading-tight">{r.label}</span>
            </button>
          ))}
        </div>
        <p className="font-mono-nota text-[11px] text-stone-500 bg-white border border-stone-900/10 rounded-lg px-3 py-2 mb-5">{ROLES[selectedRole].desc}</p>

        <button onClick={fillDemo} className="w-full mb-5 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-[#F0A202]/40 bg-[#F0A202]/10 text-[#8a5c02] text-sm font-semibold hover:bg-[#F0A202]/20">
          <Sparkles className="w-4 h-4" /> Isi Data Demo (Akun Aktif) — {ROLES[selectedRole].label}
        </button>

        <form onSubmit={submit} className="flex flex-col gap-3">
          <div>
            <label className="text-xs font-medium text-stone-600 mb-1 block">Email</label>
            <div className="flex items-center gap-2 border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 focus-within:border-[#D5451B]">
              <Mail className="w-4 h-4 text-stone-400" />
              <input value={email} onChange={(e) => setEmail(e.target.value)} type="email" placeholder="nama@toko.id" className="flex-1 text-sm outline-none" />
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-stone-600 mb-1 block">Kata Sandi</label>
            <div className="flex items-center gap-2 border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 focus-within:border-[#D5451B]">
              <Lock className="w-4 h-4 text-stone-400" />
              <input value={password} onChange={(e) => setPassword(e.target.value)} type={showPassword ? "text" : "password"} placeholder="••••••••" className="flex-1 text-sm outline-none" />
              <button type="button" onClick={() => setShowPassword((v) => !v)} className="text-stone-400 hover:text-stone-600">
                {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
              </button>
            </div>
          </div>
          {error && (
            <p className="flex items-start gap-1.5 text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2">
              <ShieldAlert className="w-3.5 h-3.5 shrink-0 mt-0.5" /> {error}
            </p>
          )}
          <button type="submit" className="mt-2 inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-stone-900 text-white font-semibold text-sm hover:bg-stone-800">
            <LogIn className="w-4 h-4" /> Masuk sebagai {ROLES[selectedRole].label}
          </button>
        </form>
        <button onClick={onGoRegister} className="w-full text-center font-mono-nota text-[11px] text-stone-500 hover:text-[#D5451B] mt-5">
          Toko Anda belum berlangganan? <span className="underline font-semibold">Daftar &amp; Berlangganan JAWARA</span>
        </button>
      </div>
    </div>
  );
}

// ---------------- Register / Berlangganan ----------------
// Real signup flow: pick a plan, pay for it, and JAWARA creates a working
// store account (with its own Admin + Kasir login) that LoginPage can
// authenticate against — this is what makes a person an actual "paid /
// subscriber" user of the system instead of a demo role.
function RegisterPage({ onBack, onRegistered, settings }) {
  const [step, setStep] = useState(1); // 1: data toko, 2: bayar
  const [form, setForm] = useState({ storeName: "", owner: "", email: "", password: "", confirmPassword: "", plan: "Pro" });
  const [paymentMethod, setPaymentMethod] = useState("qris");
  const [error, setError] = useState("");
  const [paying, setPaying] = useState(false);

  const selectedPlan = SUBSCRIPTION_PLANS.find((p) => p.key === form.plan) || SUBSCRIPTION_PLANS[0];

  const goToPayment = (e) => {
    e.preventDefault();
    setError("");
    if (!form.storeName.trim() || !form.owner.trim() || !form.email.trim() || !form.password) {
      setError("Lengkapi semua data toko terlebih dahulu.");
      return;
    }
    if (form.password.length < 6) {
      setError("Kata sandi minimal 6 karakter.");
      return;
    }
    if (form.password !== form.confirmPassword) {
      setError("Konfirmasi kata sandi tidak cocok.");
      return;
    }
    const accounts = readAccounts();
    const emailTaken = accounts.some((a) => a.email.toLowerCase() === form.email.trim().toLowerCase());
    if (emailTaken) {
      setError("Email ini sudah terdaftar sebagai akun toko JAWARA. Silakan masuk, atau gunakan email lain.");
      return;
    }
    setStep(2);
  };

  // No real payment gateway here (this is a static, backend-less app) — but
  // the account is only created and made Aktif *after* this step, mirroring
  // a real "pay to activate" subscription flow rather than granting access
  // for free.
  const pay = () => {
    setPaying(true);
    setTimeout(() => {
      const accounts = readAccounts();
      const expires = new Date();
      expires.setDate(expires.getDate() + 30);
      const newAccount = {
        id: "A" + Date.now(),
        storeName: form.storeName.trim(),
        owner: form.owner.trim(),
        plan: form.plan,
        status: "Aktif",
        expiresAt: expires.toISOString().slice(0, 10),
        email: form.email.trim().toLowerCase(),
        password: form.password,
        kasirEmail: "kasir@" + form.email.trim().toLowerCase().split("@")[1],
        kasirPassword: form.password,
      };
      writeAccounts([...accounts, newAccount]);
      setPaying(false);
      onRegistered(newAccount.email);
    }, 900);
  };

  return (
    <div className="min-h-screen bg-ink flex items-center justify-center p-5 relative overflow-hidden">
      <div className="absolute -top-24 -left-24 w-72 h-72 rounded-full bg-[#D5451B]/20 blur-3xl" />
      <div className="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-[#F0A202]/15 blur-3xl" />

      <div className="w-full max-w-md bg-nota-paper rounded-3xl shadow-2xl p-8 relative border border-white/10">
        <button onClick={step === 2 ? () => setStep(1) : onBack} className="inline-flex items-center gap-1.5 font-mono-nota text-xs font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-900/5 border border-stone-900/15 rounded-full px-3 py-1.5 mb-6 transition-colors">
          <ArrowLeft className="w-3.5 h-3.5" /> {step === 2 ? "Kembali ke Data Toko" : "Kembali ke Beranda"}
        </button>
        <div className="mb-6"><Logo logoUrl={settings.logoUrl} /></div>

        {step === 1 ? (
          <>
            <h1 className="font-display text-2xl uppercase text-stone-900 mb-1">Daftar &amp; Berlangganan</h1>
            <p className="text-sm text-stone-500 mb-5">Buat akun toko Anda sendiri — login sungguhan setelah berlangganan aktif.</p>

            <form onSubmit={goToPayment} className="flex flex-col gap-3">
              <div>
                <label className="text-xs font-medium text-stone-600 mb-1 block">Nama Toko</label>
                <input value={form.storeName} onChange={(e) => setForm({ ...form, storeName: e.target.value })} placeholder="Toko Anda" className="w-full border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 text-sm outline-none focus:border-[#D5451B]" />
              </div>
              <div>
                <label className="text-xs font-medium text-stone-600 mb-1 block">Nama Pemilik</label>
                <input value={form.owner} onChange={(e) => setForm({ ...form, owner: e.target.value })} placeholder="Nama Anda" className="w-full border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 text-sm outline-none focus:border-[#D5451B]" />
              </div>
              <div>
                <label className="text-xs font-medium text-stone-600 mb-1 block">Email</label>
                <div className="flex items-center gap-2 border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 focus-within:border-[#D5451B]">
                  <Mail className="w-4 h-4 text-stone-400" />
                  <input value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} type="email" placeholder="nama@toko.id" className="flex-1 text-sm outline-none" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs font-medium text-stone-600 mb-1 block">Kata Sandi</label>
                  <div className="flex items-center gap-2 border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 focus-within:border-[#D5451B]">
                    <Lock className="w-4 h-4 text-stone-400 shrink-0" />
                    <input value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} type="password" placeholder="Min. 6 karakter" className="flex-1 min-w-0 text-sm outline-none" />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-stone-600 mb-1 block">Ulangi Sandi</label>
                  <div className="flex items-center gap-2 border border-stone-900/15 bg-white rounded-xl px-3 py-2.5 focus-within:border-[#D5451B]">
                    <KeyRound className="w-4 h-4 text-stone-400 shrink-0" />
                    <input value={form.confirmPassword} onChange={(e) => setForm({ ...form, confirmPassword: e.target.value })} type="password" placeholder="Ulangi" className="flex-1 min-w-0 text-sm outline-none" />
                  </div>
                </div>
              </div>

              <div>
                <label className="text-xs font-medium text-stone-600 mb-1.5 block">Pilih Paket</label>
                <div className="grid grid-cols-3 gap-2">
                  {SUBSCRIPTION_PLANS.map((p) => (
                    <button type="button" key={p.key} onClick={() => setForm({ ...form, plan: p.key })} className={`flex flex-col items-center gap-1 rounded-xl border px-2 py-3 text-center transition-colors ${form.plan === p.key ? "border-[#D5451B] bg-[#D5451B]/10" : "border-stone-900/10 bg-white hover:border-stone-900/25"}`}>
                      <span className="font-mono-nota text-[11px] font-semibold text-stone-800">{p.key}</span>
                      <span className="text-[10px] text-stone-500">{rupiah(p.price)}/bln</span>
                    </button>
                  ))}
                </div>
              </div>

              {error && (
                <p className="flex items-start gap-1.5 text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2">
                  <ShieldAlert className="w-3.5 h-3.5 shrink-0 mt-0.5" /> {error}
                </p>
              )}
              <button type="submit" className="mt-2 inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-stone-900 text-white font-semibold text-sm hover:bg-stone-800">
                Lanjut ke Pembayaran <ArrowRight className="w-4 h-4" />
              </button>
            </form>
          </>
        ) : (
          <>
            <h1 className="font-display text-2xl uppercase text-stone-900 mb-1">Pembayaran</h1>
            <p className="text-sm text-stone-500 mb-5">Paket <strong>{selectedPlan.key}</strong> — aktif 30 hari sejak pembayaran berhasil.</p>

            <div className="flex items-center justify-between bg-white border border-stone-900/10 rounded-xl px-4 py-3 mb-5">
              <span className="text-sm text-stone-600">Total Tagihan</span>
              <span className="font-display text-xl text-[#D5451B]">{rupiah(selectedPlan.price)}</span>
            </div>

            <label className="text-xs font-medium text-stone-600 mb-1.5 block">Metode Pembayaran</label>
            <div className="grid grid-cols-2 gap-2 mb-6">
              {PAYMENT_METHODS.filter((m) => m.key !== "tunai").map((m) => (
                <button type="button" key={m.key} onClick={() => setPaymentMethod(m.key)} className={`flex items-center gap-2 rounded-xl border px-3 py-2.5 text-left transition-colors ${paymentMethod === m.key ? "border-[#D5451B] bg-[#D5451B]/10" : "border-stone-900/10 bg-white hover:border-stone-900/25"}`}>
                  <m.icon className="w-4 h-4 text-stone-600 shrink-0" />
                  <span className="text-xs font-semibold text-stone-800">{m.label}</span>
                </button>
              ))}
            </div>

            <button onClick={pay} disabled={paying} className="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-stone-900 text-white font-semibold text-sm hover:bg-stone-800 disabled:opacity-60">
              {paying ? <><Loader2 className="w-4 h-4 animate-spin" /> Memproses Pembayaran...</> : <><CheckCircle2 className="w-4 h-4" /> Bayar {rupiah(selectedPlan.price)}</>}
            </button>
            <p className="text-center font-mono-nota text-[10px] text-stone-400 mt-4">Simulasi pembayaran untuk keperluan demo — akun baru langsung Aktif setelah dikonfirmasi.</p>
          </>
        )}
      </div>
    </div>
  );
}

// Small searchable combobox for picking a member during checkout — plain
// <select> gets unwieldy once there are more than a handful of pelanggan,
// so this filters by name or phone as the cashier types.
function MemberPicker({ customers, value, onChange }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const selected = customers.find((c) => c.id === value) || null;

  useEffect(() => {
    const onClickOutside = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  const q = query.trim().toLowerCase();
  const filtered = customers.filter((c) => c.name.toLowerCase().includes(q) || (c.phone || "").includes(q));

  const pick = (c) => { onChange(c ? c.id : ""); setQuery(""); setOpen(false); };

  return (
    <div ref={wrapRef} className="relative">
      <div className="flex items-center gap-2 border border-slate-200 rounded-lg px-2.5 py-2 focus-within:border-violet-400 bg-white">
        <Search className="w-3.5 h-3.5 text-slate-400 shrink-0" />
        <input
          value={open ? query : (selected ? selected.name : "")}
          onChange={(e) => { setQuery(e.target.value); if (selected) onChange(""); }}
          onFocus={() => { setOpen(true); setQuery(""); }}
          placeholder="Cari nama atau telepon member..."
          className="flex-1 text-xs outline-none min-w-0"
        />
        {selected && !open && (
          <button type="button" onClick={() => pick(null)} className="text-slate-300 hover:text-rose-500 shrink-0"><X className="w-3.5 h-3.5" /></button>
        )}
      </div>
      {open && (
        <div className="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg py-1">
          <button type="button" onClick={() => pick(null)} className="w-full text-left px-3 py-2 text-xs text-slate-500 hover:bg-slate-50">Tanpa member</button>
          {filtered.map((c) => (
            <button type="button" key={c.id} onClick={() => pick(c)} className="w-full text-left px-3 py-2 text-xs hover:bg-violet-50">
              <p className="font-medium text-slate-700">{c.name}</p>
              <p className="text-slate-400">{c.phone}</p>
            </button>
          ))}
          {filtered.length === 0 && <p className="px-3 py-2 text-xs text-slate-400">Member tidak ditemukan.</p>}
        </div>
      )}
    </div>
  );
}

  // button — then hands control back to the cashier to take payment.
  const [customerMode, setCustomerMode] = useState(false);
  // Mode pembayaran — defaults to Tunai. For Tunai the cashier enters cash
  // received so change (kembalian) can be computed and shown before printing.
  const [paymentMethod, setPaymentMethod] = useState("tunai");
  const [cashReceived, setCashReceived] = useState("");
  const scanRef = useRef(null);

  useEffect(() => {
    if (!customerMode) scanRef.current?.focus();
  }, [customerMode]);

  const addToCart = (product) => {
    const inCart = cart.find((c) => c.id === product.id)?.qty || 0;
    if (inCart >= product.stock) { notify("Stok tidak mencukupi"); return; }
    setCart((c) => {
      const exist = c.find((i) => i.id === product.id);
      if (exist) return c.map((i) => (i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
      return [...c, { id: product.id, qty: 1 }];
    });
  };

  const handleScan = (e) => {
    if (e.key !== "Enter") return;
    const code = scanValue.trim();
    if (!code) return;
    const found = products.find((p) => p.barcode === code);
    if (found) { addToCart(found); notify(`${found.name} ditambahkan (scan)`); }
    else notify("Barcode tidak ditemukan");
    setScanValue("");
  };

  const changeQty = (id, delta) => {
    setCart((c) => c.map((i) => (i.id === id ? { ...i, qty: i.qty + delta } : i)).filter((i) => i.qty > 0));
  };

  const removeItem = (id) => setCart((c) => c.filter((i) => i.id !== id));

  const cartItems = cart.map((c) => ({ ...c, product: products.find((p) => p.id === c.id) }));
  const subtotal = cartItems.reduce((s, i) => s + i.product.price * i.qty, 0);
  const totalQty = cartItems.reduce((s, i) => s + i.qty, 0);

  const selectedCustomer = customers.find((c) => c.id === customerId) || null;
  const memberDiscountPercent = selectedCustomer ? (settings.memberDiscountPercent || 0) : 0;
  const memberDiscountAmount = Math.round((subtotal * memberDiscountPercent) / 100);
  const afterMemberDiscount = subtotal - memberDiscountAmount;

  const promoDiscountPercent = appliedPromo ? appliedPromo.percent : 0;
  const promoDiscountAmount = Math.round((afterMemberDiscount * promoDiscountPercent) / 100);
  const taxableAmount = afterMemberDiscount - promoDiscountAmount;

  const taxPercent = settings.taxPercent || 0;
  const taxAmount = Math.round((taxableAmount * taxPercent) / 100);
  const total = taxableAmount + taxAmount;

  const applyPromoCode = () => {
    const code = promoInput.trim().toUpperCase();
    if (!code) return;
    const found = (settings.discountCodes || []).find((d) => d.active && d.code.toUpperCase() === code);
    if (found) {
      setAppliedPromo({ code: found.code, percent: found.percent });
      notify(`Kode ${found.code} diterapkan — potongan ${found.percent}%`);
    } else {
      notify("Kode diskon tidak ditemukan / tidak aktif");
    }
    setPromoInput("");
  };

  const removePromo = () => setAppliedPromo(null);

  const cashReceivedAmount = Number(cashReceived) || 0;
  const changeDue = cashReceivedAmount - total;
  const isCashMethod = paymentMethod === "tunai";
  // Non-cash methods (QRIS/kartu/transfer) are assumed settled exactly, so
  // there's nothing to collect or short-count — only Tunai needs the cash
  // received to at least cover the total before checkout is allowed.
  const canCheckout = cartItems.length > 0 && (!isCashMethod || cashReceivedAmount >= total);

  const checkout = () => {
    if (!canCheckout) return;
    const invNo = String(transactions.length + 1).padStart(3, "0");
    const methodInfo = PAYMENT_METHODS.find((m) => m.key === paymentMethod) || PAYMENT_METHODS[0];
    // Items are stored on the transaction itself (not just for the printed
    // invoice) so a transaction can later be voided from Laporan with stock
    // correctly restored.
    const items = cartItems.map((i) => ({ id: i.product.id, name: i.product.name, qty: i.qty, price: i.product.price }));
    const newTx = {
      id: `INV-${new Date().toISOString().slice(2, 10).replace(/-/g, "")}-${invNo}`,
      time: new Date().toLocaleString("id-ID", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }),
      qty: totalQty,
      items,
      customerId: selectedCustomer?.id || null,
      customerName: selectedCustomer?.name || null,
      subtotal,
      memberDiscountPercent,
      memberDiscountAmount,
      promoCode: appliedPromo?.code || null,
      promoDiscountPercent,
      promoDiscountAmount,
      taxPercent,
      taxAmount,
      total,
      paymentMethod: methodInfo.key,
      paymentLabel: methodInfo.label,
      cashReceived: isCashMethod ? cashReceivedAmount : null,
      changeDue: isCashMethod ? changeDue : null,
    };
    setTransactions((t) => [newTx, ...t]);
    setProducts((ps) => ps.map((p) => {
      const c = cart.find((i) => i.id === p.id);
      return c ? { ...p, stock: p.stock - c.qty } : p;
    }));
    setLastInvoice(newTx);
    setShowInvoice(true);
    setCart([]);
    setCustomerId("");
    setAppliedPromo(null);
    setPromoInput("");
    setPaymentMethod("tunai");
    setCashReceived("");
    playCashSound();
    notify(`Transaksi ${newTx.id} berhasil — ${methodInfo.label} — ${rupiah(total)}`);
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2">
        {customerMode ? (
          <div className="flex items-center justify-between gap-3 bg-violet-600 text-white rounded-xl px-4 py-3 mb-3">
            <div>
              <p className="font-semibold text-sm">Silakan Pilih Menu Anda</p>
              <p className="text-xs text-violet-100">Ketuk produk untuk menambah ke pesanan</p>
            </div>
            <button onClick={() => setCustomerMode(false)} className="shrink-0 inline-flex items-center gap-1.5 bg-white text-violet-700 text-xs font-semibold px-3 py-2 rounded-lg hover:bg-violet-50">
              <ArrowLeft className="w-3.5 h-3.5" /> Kembali ke Kasir
            </button>
          </div>
        ) : (
          <div className="flex items-center gap-2 mb-3">
            <div className="flex-1 flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2.5 focus-within:border-violet-400">
              <ScanLine className="w-4 h-4 text-violet-500 shrink-0" />
              <input
                ref={scanRef}
                value={scanValue}
                onChange={(e) => setScanValue(e.target.value)}
                onKeyDown={handleScan}
                placeholder="Scan atau ketik barcode produk lalu tekan Enter..."
                className="flex-1 text-sm outline-none"
              />
            </div>
            <button onClick={() => setCustomerMode(true)} title="Serahkan layar ke pelanggan untuk memilih sendiri" className="shrink-0 inline-flex items-center gap-1.5 border border-violet-200 bg-violet-50 text-violet-700 text-xs font-semibold px-3 py-2.5 rounded-xl hover:bg-violet-100">
              <Users className="w-4 h-4" /> <span className="hidden sm:inline">Mode Pelanggan</span>
            </button>
          </div>
        )}

        <div className={`grid grid-cols-2 sm:grid-cols-3 gap-3 ${customerMode ? "sm:grid-cols-2 lg:grid-cols-3 gap-4" : ""}`}>
          {products.map((p) => {
            const Icon = ICONS[p.iconName] || Box;
            return (
              <button
                key={p.id}
                onClick={() => addToCart(p)}
                disabled={p.stock === 0}
                className={`text-left bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md hover:border-violet-200 transition-all disabled:opacity-40 disabled:cursor-not-allowed ${customerMode ? "p-5" : "p-3.5"}`}
              >
                {/* Product photos only render in Mode Pelanggan (the
                    customer-facing browse screen) — the cashier's own grid
                    stays icon-only so it loads and scans fast. */}
                {customerMode && p.image ? (
                  <div className="rounded-xl overflow-hidden mb-3 w-full aspect-square bg-slate-100">
                    <img src={p.image} alt={p.name} loading="lazy" className="w-full h-full object-cover" />
                  </div>
                ) : (
                  <div className={`rounded-lg flex items-center justify-center mb-2.5 ${p.color} ${customerMode ? "w-14 h-14" : "w-9 h-9"}`}><Icon className={customerMode ? "w-7 h-7" : "w-4 h-4"} /></div>
                )}
                <p className={`font-semibold text-slate-800 ${customerMode ? "text-base" : "text-sm"}`}>{p.name}</p>
                {!customerMode && <p className="text-xs text-slate-400 mb-1">Stok: {p.stock}</p>}
                <p className={`font-bold text-violet-600 mb-1 ${customerMode ? "text-lg" : "text-sm"}`}>{rupiah(p.price)}</p>
                {!customerMode && <p className="text-[10px] font-mono text-slate-300 tracking-wide">{p.barcode}</p>}
              </button>
            );
          })}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 flex flex-col h-fit sticky top-20">
        <div className="flex items-center gap-2 mb-3">
          <ShoppingCart className="w-4 h-4 text-violet-600" />
          <p className="font-semibold text-slate-800 text-sm">{customerMode ? "Pesanan Anda" : "Keranjang"}</p>
        </div>

        {cartItems.length === 0 ? (
          <p className="text-sm text-slate-400 py-8 text-center">{customerMode ? "Ketuk menu di sebelah kiri untuk memesan." : "Klik produk atau scan barcode untuk menambah ke keranjang."}</p>
        ) : (
          <div className="flex flex-col divide-y divide-slate-50 mb-3 max-h-72 overflow-y-auto">
            {cartItems.map((i) => (
              <div key={i.id} className="py-2.5">
                <div className="flex items-center justify-between mb-1.5">
                  <p className="text-sm font-medium text-slate-700 truncate pr-2">{i.product.name}</p>
                  <button onClick={() => removeItem(i.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-3.5 h-3.5" /></button>
                </div>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button onClick={() => changeQty(i.id, -1)} className="w-6 h-6 rounded-md border border-slate-200 flex items-center justify-center hover:bg-slate-50"><Minus className="w-3 h-3" /></button>
                    <span className="text-sm font-medium w-5 text-center">{i.qty}</span>
                    <button onClick={() => changeQty(i.id, 1)} className="w-6 h-6 rounded-md border border-slate-200 flex items-center justify-center hover:bg-slate-50"><Plus className="w-3 h-3" /></button>
                  </div>
                  <p className="text-sm font-semibold text-slate-800">{rupiah(i.product.price * i.qty)}</p>
                </div>
              </div>
            ))}
          </div>
        )}

        {!customerMode && cartItems.length > 0 && (
          <div className="flex flex-col gap-2 border-t border-slate-100 pt-3 mb-1">
            <div>
              <label className="text-[11px] font-medium text-slate-500 mb-1 block">Member (opsional)</label>
              <MemberPicker customers={customers} value={customerId} onChange={setCustomerId} />
            </div>
            {appliedPromo ? (
              <div className="flex items-center justify-between bg-emerald-50 border border-emerald-100 rounded-lg px-2.5 py-2">
                <span className="text-xs font-mono font-semibold text-emerald-700">{appliedPromo.code} (-{appliedPromo.percent}%)</span>
                <button onClick={removePromo} className="text-emerald-600 hover:text-rose-500"><X className="w-3.5 h-3.5" /></button>
              </div>
            ) : (
              <div className="flex items-center gap-1.5">
                <input value={promoInput} onChange={(e) => setPromoInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && applyPromoCode()} placeholder="Kode diskon" className="flex-1 border border-slate-200 rounded-lg px-2.5 py-2 text-xs font-mono outline-none focus:border-violet-400" />
                <button onClick={applyPromoCode} className="shrink-0 px-2.5 py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">Pakai</button>
              </div>
            )}
          </div>
        )}

        {!customerMode && cartItems.length > 0 && (
          <div className="flex flex-col gap-2 border-t border-slate-100 pt-3 mb-1">
            <label className="text-[11px] font-medium text-slate-500 block">Mode Pembayaran</label>
            <div className="grid grid-cols-3 gap-1.5">
              {PAYMENT_METHODS.map((m) => (
                <button
                  type="button"
                  key={m.key}
                  onClick={() => { setPaymentMethod(m.key); if (m.key !== "tunai") setCashReceived(""); }}
                  className={`flex flex-col items-center gap-1 rounded-lg border px-1.5 py-2 text-center transition-colors ${
                    paymentMethod === m.key ? "border-violet-500 bg-violet-50 text-violet-700" : "border-slate-200 text-slate-500 hover:border-slate-300"
                  }`}
                >
                  <m.icon className="w-4 h-4" />
                  <span className="text-[10px] font-semibold leading-tight">{m.label}</span>
                </button>
              ))}
            </div>
            {isCashMethod && (
              <div className="flex flex-col gap-1.5 bg-slate-50 border border-slate-100 rounded-lg p-2.5">
                <label className="text-[11px] font-medium text-slate-500 block">Uang Diterima</label>
                <input
                  value={cashReceived}
                  onChange={(e) => setCashReceived(e.target.value.replace(/[^0-9]/g, ""))}
                  inputMode="numeric"
                  placeholder="0"
                  className="border border-slate-200 rounded-lg px-2.5 py-2 text-sm font-mono outline-none focus:border-violet-400 bg-white"
                />
                <div className="flex flex-wrap gap-1.5">
                  {[total, ...[20000, 50000, 100000].filter((v) => v >= total)].sort((a, b) => a - b).slice(0, 3).map((v) => (
                    <button type="button" key={v} onClick={() => setCashReceived(String(v))} className="px-2 py-1 rounded-md bg-white border border-slate-200 text-[11px] font-semibold text-slate-600 hover:bg-slate-100">
                      {rupiah(v)}
                    </button>
                  ))}
                </div>
                {cashReceived !== "" && (
                  changeDue >= 0 ? (
                    <p className="text-xs font-semibold text-emerald-600">Kembalian: {rupiah(changeDue)}</p>
                  ) : (
                    <p className="text-xs font-semibold text-rose-500">Kurang: {rupiah(Math.abs(changeDue))}</p>
                  )
                )}
              </div>
            )}
          </div>
        )}

        <div className="border-t border-slate-100 pt-3 flex flex-col gap-1 mb-3">
          {!customerMode && (memberDiscountAmount > 0 || promoDiscountAmount > 0 || taxAmount > 0) && (
            <>
              <div className="flex items-center justify-between text-xs text-slate-500">
                <span>Subtotal</span><span>{rupiah(subtotal)}</span>
              </div>
              {memberDiscountAmount > 0 && (
                <div className="flex items-center justify-between text-xs text-emerald-600">
                  <span>Diskon Member ({memberDiscountPercent}%)</span><span>-{rupiah(memberDiscountAmount)}</span>
                </div>
              )}
              {promoDiscountAmount > 0 && (
                <div className="flex items-center justify-between text-xs text-emerald-600">
                  <span>Diskon {appliedPromo?.code} ({promoDiscountPercent}%)</span><span>-{rupiah(promoDiscountAmount)}</span>
                </div>
              )}
              {taxAmount > 0 && (
                <div className="flex items-center justify-between text-xs text-slate-500">
                  <span>PPN ({taxPercent}%)</span><span>{rupiah(taxAmount)}</span>
                </div>
              )}
            </>
          )}
          <div className="flex items-center justify-between pt-1">
            <p className="text-sm font-medium text-slate-500">Total</p>
            <p className="text-lg font-bold text-violet-600">{rupiah(total)}</p>
          </div>
        </div>
        {customerMode ? (
          <button onClick={() => { playTringSound(); setCustomerMode(false); }} disabled={cartItems.length === 0} className="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-violet-600 text-white font-semibold text-sm hover:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed">
            <ArrowRight className="w-4 h-4" /> Serahkan ke Kasir
          </button>
        ) : (
          <button onClick={checkout} disabled={!canCheckout} className="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-amber-400 text-violet-900 font-semibold text-sm hover:bg-amber-300 disabled:opacity-40 disabled:cursor-not-allowed">
            <CreditCard className="w-4 h-4" /> Bayar Sekarang
          </button>
        )}
      </div>

      {showInvoice && <InvoiceModal invoice={lastInvoice} settings={settings} onClose={() => setShowInvoice(false)} />}
    </div>
  );
}

function ProdukPage({ products, setProducts, notify }) {
  const [form, setForm] = useState({ name: "", price: "", stock: "", image: "" });
  const [editingId, setEditingId] = useState(null);
  const imageRef = useRef(null);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({ name: p.name, price: String(p.price), stock: String(p.stock), image: p.image || "" });
  };
  const cancelEdit = () => {
    setEditingId(null);
    setForm({ name: "", price: "", stock: "", image: "" });
  };

  const pickImage = () => imageRef.current?.click();

  const onImageChange = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    if (!file.type.startsWith("image/")) { notify("File harus berupa gambar"); return; }
    if (file.size > 5 * 1024 * 1024) { notify("Ukuran gambar maksimal 5MB"); return; }
    try {
      const dataUrl = await fileToResizedDataURL(file);
      setForm((f) => ({ ...f, image: dataUrl }));
    } catch (err) {
      notify("Gagal memproses gambar");
    }
  };

  const removeImage = () => setForm((f) => ({ ...f, image: "" }));

  const submitProduct = (e) => {
    e.preventDefault();
    if (!form.name || !form.price || !form.stock) return;
    if (editingId) {
      setProducts((ps) => ps.map((p) => (p.id === editingId
        ? { ...p, name: form.name, price: Number(form.price), stock: Number(form.stock), image: form.image }
        : p)));
      notify("Produk diperbarui");
      cancelEdit();
    } else {
      const id = "P" + (products.length + 1) + "-" + Date.now().toString().slice(-4);
      const barcode = genBarcode(id);
      setProducts((ps) => [...ps, { id, name: form.name, price: Number(form.price), stock: Number(form.stock), iconName: "Box", color: "bg-violet-100 text-violet-700", barcode, image: form.image }]);
      setForm({ name: "", price: "", stock: "", image: "" });
      notify(`Produk ditambahkan — barcode ${barcode} dibuat otomatis`);
    }
  };

  const removeProduct = (id) => {
    if (!window.confirm("Hapus produk ini? Data barcode & stok terkait juga akan hilang.")) return;
    setProducts((ps) => ps.filter((p) => p.id !== id));
    if (editingId === id) cancelEdit();
    notify("Produk dihapus");
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr><th className="text-left font-medium px-4 py-3">Produk</th><th className="text-left font-medium px-4 py-3">Barcode</th><th className="text-left font-medium px-4 py-3">Harga</th><th className="text-left font-medium px-4 py-3">Stok</th><th className="px-4 py-3"></th></tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {products.map((p) => {
              const Icon = ICONS[p.iconName] || Box;
              return (
                <tr key={p.id} className={editingId === p.id ? "bg-violet-50/40" : undefined}>
                  <td className="px-4 py-3 flex items-center gap-2.5">
                    {p.image ? (
                      <img src={p.image} alt={p.name} className="w-8 h-8 rounded-lg object-cover" />
                    ) : (
                      <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${p.color}`}><Icon className="w-4 h-4" /></div>
                    )}
                    <span className="font-medium text-slate-700">{p.name}</span>
                  </td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-500">{p.barcode}</td>
                  <td className="px-4 py-3 text-slate-600">{rupiah(p.price)}</td>
                  <td className="px-4 py-3"><span className={p.stock < 5 ? "text-rose-500 font-medium" : "text-slate-600"}>{p.stock}</span></td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <button onClick={() => startEdit(p)} className="text-slate-300 hover:text-violet-600 mr-2"><Pencil className="w-4 h-4" /></button>
                    <button onClick={() => removeProduct(p.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-4 h-4" /></button>
                  </td>
                </tr>
              );
            })}
            {products.length === 0 && (
              <tr><td colSpan={5} className="px-4 py-6 text-center text-sm text-slate-400">Belum ada produk.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      <form onSubmit={submitProduct} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 h-fit">
        <p className="font-semibold text-slate-800 text-sm mb-3">{editingId ? "✎ Edit Produk" : "+ Tambah Produk"}</p>
        <div className="flex flex-col gap-3">
          <div>
            <label className="text-xs font-medium text-slate-600 mb-1 block">Foto Produk (opsional)</label>
            <div className="flex items-center gap-3">
              {form.image ? (
                <img src={form.image} alt="Pratinjau produk" className="w-12 h-12 rounded-lg object-cover border border-slate-200" />
              ) : (
                <div className="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center text-slate-300"><Boxes className="w-5 h-5" /></div>
              )}
              <div className="flex flex-col gap-1">
                <button type="button" onClick={pickImage} className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                  <Upload className="w-3.5 h-3.5" /> {form.image ? "Ganti Foto" : "Unggah Foto"}
                </button>
                {form.image && (
                  <button type="button" onClick={removeImage} className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold text-rose-500 hover:bg-rose-50">
                    <RotateCcw className="w-3.5 h-3.5" /> Hapus Foto
                  </button>
                )}
              </div>
              <input ref={imageRef} type="file" accept="image/*" onChange={onImageChange} className="hidden" />
            </div>
            <p className="text-[11px] text-slate-400 mt-1">Tampil di Mode Pelanggan. Layar kasir tetap pakai ikon saja biar ringan.</p>
          </div>
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Nama produk" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <input value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} type="number" placeholder="Harga (Rp)" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <input value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} type="number" placeholder="Stok" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          {!editingId && <p className="text-[11px] text-slate-400">Barcode 13 digit akan dibuat otomatis saat produk disimpan.</p>}
          <div className="flex items-center gap-2">
            <button type="submit" className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700">
              {editingId ? <><Pencil className="w-4 h-4" /> Simpan Perubahan</> : <><Plus className="w-4 h-4" /> Tambah</>}
            </button>
            {editingId && (
              <button type="button" onClick={cancelEdit} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Batal</button>
            )}
          </div>
        </div>
      </form>
    </div>

}

function BarcodeBars({ code }) {
  const bars = code.split("").map((n) => 2 + (Number(n) % 5));
  return (
    <div className="flex items-end gap-[2px] h-20">
      {bars.map((h, i) => <div key={i} className="bg-slate-900 w-[3px]" style={{ height: `${h * 8}px` }} />)}
    </div>
  );
}

function BarcodePage({ products }) {
  const [selected, setSelected] = useState(products[0]?.id || "");
  const [copies, setCopies] = useState(1);
  // "single" prints just the selected product; "all" prints one label sheet
  // covering every product in the catalog (each repeated `copies` times).
  const [mode, setMode] = useState("single");
  const product = products.find((p) => p.id === selected) || products[0];

  useEffect(() => {
    if (!products.find((p) => p.id === selected) && products[0]) setSelected(products[0].id);
  }, [products]);

  // The printable area is swapped based on `mode` before printing, so
  // window.print() always captures exactly the labels the user asked for.
  const doPrint = (nextMode) => {
    setMode(nextMode);
    setTimeout(() => window.print(), 50);
  };

  const labels = mode === "all"
    ? products.flatMap((p) => Array.from({ length: copies }).map((_, i) => ({ key: `${p.id}-${i}`, item: p })))
    : product ? Array.from({ length: copies }).map((_, i) => ({ key: `${product.id}-${i}`, item: product })) : [];

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
        <p className="font-semibold text-slate-800 text-sm mb-3">Pilih Produk</p>
        <select value={selected} onChange={(e) => setSelected(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400">
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        {product && (
          <div className="mt-4 text-sm text-slate-500">
            <p>Harga: <span className="font-medium text-slate-700">{rupiah(product.price)}</span></p>
            <p>Stok: <span className="font-medium text-slate-700">{product.stock}</span></p>
            <p>Barcode: <span className="font-mono font-medium text-slate-700">{product.barcode}</span></p>
          </div>
        )}
        <div className="mt-4">
          <label className="text-xs font-medium text-slate-600 mb-1 block">Jumlah Label per Produk</label>
          <input type="number" min="1" max="24" value={copies} onChange={(e) => setCopies(Math.max(1, Math.min(24, Number(e.target.value) || 1)))} className="w-24 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <button onClick={() => doPrint("single")} disabled={!product} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700 disabled:opacity-40">
            <Printer className="w-4 h-4" /> Cetak Produk Ini
          </button>
          <button onClick={() => doPrint("all")} disabled={products.length === 0} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-violet-200 bg-violet-50 text-violet-700 text-sm font-semibold hover:bg-violet-100 disabled:opacity-40">
            <Printer className="w-4 h-4" /> Cetak Semua Produk ({products.length})
          </button>
        </div>
      </div>
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 flex flex-col items-center justify-center">
        {product ? (
          <>
            <BarcodeBars code={product.barcode} />
            <p className="text-sm font-mono tracking-widest text-slate-700 mt-3">{product.barcode}</p>
            <p className="text-xs text-slate-400 mt-1">{product.name}</p>
          </>
        ) : <p className="text-sm text-slate-400">Tambahkan produk terlebih dahulu.</p>}
      </div>

      {labels.length > 0 && (
        <div id="barcode-print" className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
          <p className="text-xs text-slate-500 mb-3">
            {mode === "all"
              ? `Pratinjau cetak semua produk — ${products.length} produk × ${copies} label`
              : `Pratinjau ${copies} label — ${product?.name}`}
          </p>
          <div className="flex flex-wrap gap-3">
            {labels.map(({ key, item }) => (
              <div key={key} className="border border-slate-200 rounded-lg p-3 flex flex-col items-center w-40">
                <p className="text-[11px] font-semibold text-slate-700 mb-1 truncate w-full text-center">{item.name}</p>
                <BarcodeBars code={item.barcode} />
                <p className="text-[10px] font-mono tracking-widest text-slate-700 mt-2">{item.barcode}</p>
                <p className="text-[10px] text-violet-600 font-bold mt-0.5">{rupiah(item.price)}</p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PeopleTable({ title, people, setPeople, notify, placeholderName }) {
  const [form, setForm] = useState({ name: "", phone: "" });
  const [editingId, setEditingId] = useState(null);
  const singular = title.slice(0, -1);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({ name: p.name, phone: p.phone });
  };
  const cancelEdit = () => {
    setEditingId(null);
    setForm({ name: "", phone: "" });
  };

  const submitPerson = (e) => {
    e.preventDefault();
    if (!form.name || !form.phone) return;
    if (editingId) {
      setPeople((ps) => ps.map((p) => (p.id === editingId ? { ...p, name: form.name, phone: form.phone } : p)));
      notify(`${singular} diperbarui`);
      cancelEdit();
    } else {
      setPeople((ps) => [...ps, { id: "X" + Date.now(), name: form.name, phone: form.phone }]);
      setForm({ name: "", phone: "" });
      notify(`${singular} berhasil ditambahkan`);
    }
  };

  const remove = (id) => {
    if (!window.confirm(`Hapus ${singular.toLowerCase()} ini?`)) return;
    setPeople((ps) => ps.filter((p) => p.id !== id));
    if (editingId === id) cancelEdit();
    notify(`${singular} dihapus`);
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr><th className="text-left font-medium px-4 py-3">Nama</th><th className="text-left font-medium px-4 py-3">Telepon</th><th className="px-4 py-3"></th></tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {people.map((p) => (
              <tr key={p.id} className={editingId === p.id ? "bg-violet-50/40" : undefined}>
                <td className="px-4 py-3 flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-violet-50 text-violet-600 flex items-center justify-center"><User className="w-4 h-4" /></div>
                  <span className="font-medium text-slate-700">{p.name}</span>
                </td>
                <td className="px-4 py-3 text-slate-600 flex items-center gap-1.5"><Phone className="w-3.5 h-3.5 text-slate-400" />{p.phone}</td>
                <td className="px-4 py-3 text-right whitespace-nowrap">
                  <button onClick={() => startEdit(p)} className="text-slate-300 hover:text-violet-600 mr-2"><Pencil className="w-4 h-4" /></button>
                  <button onClick={() => remove(p.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-4 h-4" /></button>
                </td>
              </tr>
            ))}
            {people.length === 0 && (
              <tr><td colSpan={3} className="px-4 py-6 text-center text-sm text-slate-400">Belum ada data {singular.toLowerCase()}.</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <form onSubmit={submitPerson} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 h-fit">
        <p className="font-semibold text-slate-800 text-sm mb-3">{editingId ? `✎ Edit ${singular}` : `+ Tambah ${singular}`}</p>
        <div className="flex flex-col gap-3">
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder={placeholderName} className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} placeholder="No. telepon" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <div className="flex items-center gap-2">
            <button type="submit" className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700">
              {editingId ? <><Pencil className="w-4 h-4" /> Simpan</> : <><Plus className="w-4 h-4" /> Tambah</>}
            </button>
            {editingId && (
              <button type="button" onClick={cancelEdit} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Batal</button>
            )}
          </div>
        </div>
      </form>
    </div>
  );
}
