// Deterministic 13-digit barcode generated from a product id, so every
// product always carries the same code across Penjualan, Stok, Produk, and Barcode.
function genBarcode(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  const digits = String(899000000000 + (hash % 999999999)).padStart(13, "0").slice(0, 13);
  return digits;
}

// Small hook that keeps a piece of state in sync with localStorage, so the
// whole app (products, transactions, members, suppliers, settings) survives
// refreshes and logins/logouts without a backend.
function useLocalStorageState(key, initialValue) {
  const [state, setState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : initialValue;
    } catch (err) {
      console.warn("Gagal membaca localStorage:", key, err);
      return initialValue;
    }
  });
  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(state));
    } catch (err) {
      console.warn("Gagal menyimpan localStorage:", key, err);
    }
  }, [key, state]);
  return [state, setState];
}

function PenjualanPage({ products, setProducts, transactions, setTransactions, notify, settings }) {
  const [cart, setCart] = useState([]);
  const [scanValue, setScanValue] = useState("");
  const [lastInvoice, setLastInvoice] = useState(null);
  const [showInvoice, setShowInvoice] = useState(false);
  const scanRef = useRef(null);

  useEffect(() => {
    scanRef.current?.focus();
  }, []);

  const addToCart = (product) => {
    const inCart = cart.find((c) => c.id === product.id)?.qty || 0;
    if (inCart >= product.stock) { notify("Stok tidak mencukupi"); return; }
    setCart((c) => {
      const exist = c.find((i) => i.id === product.id);
      if (exist) return c.map((i) => (i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
      return [...c, { id: product.id, qty: 1 }];
    });
  };

  const handleScan = (e) => {
    if (e.key !== "Enter") return;
    const code = scanValue.trim();
    if (!code) return;
    const found = products.find((p) => p.barcode === code);
    if (found) { addToCart(found); notify(`${found.name} ditambahkan (scan)`); }
    else notify("Barcode tidak ditemukan");
    setScanValue("");
  };

  const changeQty = (id, delta) => {
    setCart((c) => c.map((i) => (i.id === id ? { ...i, qty: i.qty + delta } : i)).filter((i) => i.qty > 0));
  };

  const removeItem = (id) => setCart((c) => c.filter((i) => i.id !== id));

  const cartItems = cart.map((c) => ({ ...c, product: products.find((p) => p.id === c.id) }));
  const total = cartItems.reduce((s, i) => s + i.product.price * i.qty, 0);
  const totalQty = cartItems.reduce((s, i) => s + i.qty, 0);

  const checkout = () => {
    if (cart.length === 0) return;
    const invNo = String(transactions.length + 1).padStart(3, "0");
    // Items are stored on the transaction itself (not just for the printed
    // invoice) so a transaction can later be voided from Laporan with stock
    // correctly restored.
    const items = cartItems.map((i) => ({ id: i.product.id, name: i.product.name, qty: i.qty, price: i.product.price }));
    const newTx = {
      id: `INV-${new Date().toISOString().slice(2, 10).replace(/-/g, "")}-${invNo}`,
      time: new Date().toLocaleString("id-ID", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }),
      qty: totalQty,
      total,
      items,
    };
    setTransactions((t) => [newTx, ...t]);
    setProducts((ps) => ps.map((p) => {
      const c = cart.find((i) => i.id === p.id);
      return c ? { ...p, stock: p.stock - c.qty } : p;
    }));
    setLastInvoice(newTx);
    setShowInvoice(true);
    setCart([]);
    notify(`Transaksi ${newTx.id} berhasil — ${rupiah(total)}`);
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2">
        <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2.5 mb-3 focus-within:border-violet-400">
          <ScanLine className="w-4 h-4 text-violet-500 shrink-0" />
          <input
            ref={scanRef}
            value={scanValue}
            onChange={(e) => setScanValue(e.target.value)}
            onKeyDown={handleScan}
            placeholder="Scan atau ketik barcode produk lalu tekan Enter..."
            className="flex-1 text-sm outline-none"
          />
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
          {products.map((p) => {
            const Icon = ICONS[p.iconName] || Box;
            return (
              <button
                key={p.id}
                onClick={() => addToCart(p)}
                disabled={p.stock === 0}
                className="text-left bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm hover:shadow-md hover:border-violet-200 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
              >
                <div className={`w-9 h-9 rounded-lg flex items-center justify-center mb-2.5 ${p.color}`}><Icon className="w-4 h-4" /></div>
                <p className="text-sm font-semibold text-slate-800">{p.name}</p>
                <p className="text-xs text-slate-400 mb-1">Stok: {p.stock}</p>
                <p className="text-sm font-bold text-violet-600 mb-1">{rupiah(p.price)}</p>
                <p className="text-[10px] font-mono text-slate-300 tracking-wide">{p.barcode}</p>
              </button>
            );
          })}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 flex flex-col h-fit sticky top-20">
        <div className="flex items-center gap-2 mb-3">
          <ShoppingCart className="w-4 h-4 text-violet-600" />
          <p className="font-semibold text-slate-800 text-sm">Keranjang</p>
        </div>

        {cartItems.length === 0 ? (
          <p className="text-sm text-slate-400 py-8 text-center">Klik produk atau scan barcode untuk menambah ke keranjang.</p>
        ) : (
          <div className="flex flex-col divide-y divide-slate-50 mb-3 max-h-72 overflow-y-auto">
            {cartItems.map((i) => (
              <div key={i.id} className="py-2.5">
                <div className="flex items-center justify-between mb-1.5">
                  <p className="text-sm font-medium text-slate-700 truncate pr-2">{i.product.name}</p>
                  <button onClick={() => removeItem(i.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-3.5 h-3.5" /></button>
                </div>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button onClick={() => changeQty(i.id, -1)} className="w-6 h-6 rounded-md border border-slate-200 flex items-center justify-center hover:bg-slate-50"><Minus className="w-3 h-3" /></button>
                    <span className="text-sm font-medium w-5 text-center">{i.qty}</span>
                    <button onClick={() => changeQty(i.id, 1)} className="w-6 h-6 rounded-md border border-slate-200 flex items-center justify-center hover:bg-slate-50"><Plus className="w-3 h-3" /></button>
                  </div>
                  <p className="text-sm font-semibold text-slate-800">{rupiah(i.product.price * i.qty)}</p>
                </div>
              </div>
            ))}
          </div>
        )}

        <div className="border-t border-slate-100 pt-3 flex items-center justify-between mb-3">
          <p className="text-sm font-medium text-slate-500">Total</p>
          <p className="text-lg font-bold text-violet-600">{rupiah(total)}</p>
        </div>
        <button onClick={checkout} disabled={cartItems.length === 0} className="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-amber-400 text-violet-900 font-semibold text-sm hover:bg-amber-300 disabled:opacity-40 disabled:cursor-not-allowed">
          <CreditCard className="w-4 h-4" /> Bayar Sekarang
        </button>
      </div>

      {showInvoice && <InvoiceModal invoice={lastInvoice} settings={settings} onClose={() => setShowInvoice(false)} />}
    </div>
  );
}

function ProdukPage({ products, setProducts, notify }) {
  const [form, setForm] = useState({ name: "", price: "", stock: "" });
  const [editingId, setEditingId] = useState(null);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({ name: p.name, price: String(p.price), stock: String(p.stock) });
  };
  const cancelEdit = () => {
    setEditingId(null);
    setForm({ name: "", price: "", stock: "" });
  };

  const submitProduct = (e) => {
    e.preventDefault();
    if (!form.name || !form.price || !form.stock) return;
    if (editingId) {
      setProducts((ps) => ps.map((p) => (p.id === editingId
        ? { ...p, name: form.name, price: Number(form.price), stock: Number(form.stock) }
        : p)));
      notify("Produk diperbarui");
      cancelEdit();
    } else {
      const id = "P" + (products.length + 1) + "-" + Date.now().toString().slice(-4);
      const barcode = genBarcode(id);
      setProducts((ps) => [...ps, { id, name: form.name, price: Number(form.price), stock: Number(form.stock), iconName: "Box", color: "bg-violet-100 text-violet-700", barcode }]);
      setForm({ name: "", price: "", stock: "" });
      notify(`Produk ditambahkan — barcode ${barcode} dibuat otomatis`);
    }
  };

  const removeProduct = (id) => {
    if (!window.confirm("Hapus produk ini? Data barcode & stok terkait juga akan hilang.")) return;
    setProducts((ps) => ps.filter((p) => p.id !== id));
    if (editingId === id) cancelEdit();
    notify("Produk dihapus");
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr><th className="text-left font-medium px-4 py-3">Produk</th><th className="text-left font-medium px-4 py-3">Barcode</th><th className="text-left font-medium px-4 py-3">Harga</th><th className="text-left font-medium px-4 py-3">Stok</th><th className="px-4 py-3"></th></tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {products.map((p) => {
              const Icon = ICONS[p.iconName] || Box;
              return (
                <tr key={p.id} className={editingId === p.id ? "bg-violet-50/40" : undefined}>
                  <td className="px-4 py-3 flex items-center gap-2.5">
                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${p.color}`}><Icon className="w-4 h-4" /></div>
                    <span className="font-medium text-slate-700">{p.name}</span>
                  </td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-500">{p.barcode}</td>
                  <td className="px-4 py-3 text-slate-600">{rupiah(p.price)}</td>
                  <td className="px-4 py-3"><span className={p.stock < 5 ? "text-rose-500 font-medium" : "text-slate-600"}>{p.stock}</span></td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <button onClick={() => startEdit(p)} className="text-slate-300 hover:text-violet-600 mr-2"><Pencil className="w-4 h-4" /></button>
                    <button onClick={() => removeProduct(p.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-4 h-4" /></button>
                  </td>
                </tr>
              );
            })}
            {products.length === 0 && (
              <tr><td colSpan={5} className="px-4 py-6 text-center text-sm text-slate-400">Belum ada produk.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      <form onSubmit={submitProduct} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 h-fit">
        <p className="font-semibold text-slate-800 text-sm mb-3">{editingId ? "✎ Edit Produk" : "+ Tambah Produk"}</p>
        <div className="flex flex-col gap-3">
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Nama produk" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <input value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} type="number" placeholder="Harga (Rp)" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <input value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} type="number" placeholder="Stok" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          {!editingId && <p className="text-[11px] text-slate-400">Barcode 13 digit akan dibuat otomatis saat produk disimpan.</p>}
          <div className="flex items-center gap-2">
            <button type="submit" className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700">

            </button>
            {editingId && (
              <button type="button" onClick={cancelEdit} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Batal</button>
            )}
          </div>
        </div>

                  <div className="flex items-center gap-2">
                    <button onClick={() => adjust(p.id, -1)} className="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center hover:bg-slate-50"><Minus className="w-3.5 h-3.5" /></button>
                    <button onClick={() => adjust(p.id, 1)} className="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center hover:bg-slate-50"><Plus className="w-3.5 h-3.5" /></button>
                  </div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function BarcodeBars({ code }) {
  const bars = code.split("").map((n) => 2 + (Number(n) % 5));
  return (
    <div className="flex items-end gap-[2px] h-20">
      {bars.map((h, i) => <div key={i} className="bg-slate-900 w-[3px]" style={{ height: `${h * 8}px` }} />)}
    </div>
  );
}

function BarcodePage({ products }) {
  const [selected, setSelected] = useState(products[0]?.id || "");
  const [copies, setCopies] = useState(1);
  // "single" prints just the selected product; "all" prints one label sheet
  // covering every product in the catalog (each repeated `copies` times).
  const [mode, setMode] = useState("single");
  const product = products.find((p) => p.id === selected) || products[0];

  useEffect(() => {
    if (!products.find((p) => p.id === selected) && products[0]) setSelected(products[0].id);
  }, [products]);

  // The printable area is swapped based on `mode` before printing, so
  // window.print() always captures exactly the labels the user asked for.
  const doPrint = (nextMode) => {
    setMode(nextMode);
    setTimeout(() => window.print(), 50);
  };

  const labels = mode === "all"
    ? products.flatMap((p) => Array.from({ length: copies }).map((_, i) => ({ key: `${p.id}-${i}`, item: p })))
    : product ? Array.from({ length: copies }).map((_, i) => ({ key: `${product.id}-${i}`, item: product })) : [];

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
        <p className="font-semibold text-slate-800 text-sm mb-3">Pilih Produk</p>
        <select value={selected} onChange={(e) => setSelected(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400">
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        {product && (
          <div className="mt-4 text-sm text-slate-500">
            <p>Harga: <span className="font-medium text-slate-700">{rupiah(product.price)}</span></p>
            <p>Stok: <span className="font-medium text-slate-700">{product.stock}</span></p>
            <p>Barcode: <span className="font-mono font-medium text-slate-700">{product.barcode}</span></p>
          </div>
        )}
        <div className="mt-4">
          <label className="text-xs font-medium text-slate-600 mb-1 block">Jumlah Label per Produk</label>
          <input type="number" min="1" max="24" value={copies} onChange={(e) => setCopies(Math.max(1, Math.min(24, Number(e.target.value) || 1)))} className="w-24 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <button onClick={() => doPrint("single")} disabled={!product} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700 disabled:opacity-40">
            <Printer className="w-4 h-4" /> Cetak Produk Ini
          </button>
          <button onClick={() => doPrint("all")} disabled={products.length === 0} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-violet-200 bg-violet-50 text-violet-700 text-sm font-semibold hover:bg-violet-100 disabled:opacity-40">
            <Printer className="w-4 h-4" /> Cetak Semua Produk ({products.length})
          </button>
        </div>
      </div>
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 flex flex-col items-center justify-center">
        {product ? (
          <>
            <BarcodeBars code={product.barcode} />
            <p className="text-sm font-mono tracking-widest text-slate-700 mt-3">{product.barcode}</p>
            <p className="text-xs text-slate-400 mt-1">{product.name}</p>
          </>
        ) : <p className="text-sm text-slate-400">Tambahkan produk terlebih dahulu.</p>}
      </div>

      {labels.length > 0 && (
        <div id="barcode-print" className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
          <p className="text-xs text-slate-500 mb-3">
            {mode === "all"
              ? `Pratinjau cetak semua produk — ${products.length} produk × ${copies} label`
              : `Pratinjau ${copies} label — ${product?.name}`}
          </p>
          <div className="flex flex-wrap gap-3">
            {labels.map(({ key, item }) => (
              <div key={key} className="border border-slate-200 rounded-lg p-3 flex flex-col items-center w-40">
                <p className="text-[11px] font-semibold text-slate-700 mb-1 truncate w-full text-center">{item.name}</p>
                <BarcodeBars code={item.barcode} />
                <p className="text-[10px] font-mono tracking-widest text-slate-700 mt-2">{item.barcode}</p>
                <p className="text-[10px] text-violet-600 font-bold mt-0.5">{rupiah(item.price)}</p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PeopleTable({ title, people, setPeople, notify, placeholderName }) {
  const [form, setForm] = useState({ name: "", phone: "" });
  const [editingId, setEditingId] = useState(null);
  const singular = title.slice(0, -1);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({ name: p.name, phone: p.phone });
  };
  const cancelEdit = () => {
    setEditingId(null);
    setForm({ name: "", phone: "" });
  };

  const submitPerson = (e) => {
    e.preventDefault();
    if (!form.name || !form.phone) return;
    if (editingId) {
      setPeople((ps) => ps.map((p) => (p.id === editingId ? { ...p, name: form.name, phone: form.phone } : p)));
      notify(`${singular} diperbarui`);
      cancelEdit();
    } else {
      setPeople((ps) => [...ps, { id: "X" + Date.now(), name: form.name, phone: form.phone }]);
      setForm({ name: "", phone: "" });
      notify(`${singular} berhasil ditambahkan`);
    }
  };

  const remove = (id) => {
    if (!window.confirm(`Hapus ${singular.toLowerCase()} ini?`)) return;
    setPeople((ps) => ps.filter((p) => p.id !== id));
    if (editingId === id) cancelEdit();
    notify(`${singular} dihapus`);
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr><th className="text-left font-medium px-4 py-3">Nama</th><th className="text-left font-medium px-4 py-3">Telepon</th><th className="px-4 py-3"></th></tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {people.map((p) => (
              <tr key={p.id} className={editingId === p.id ? "bg-violet-50/40" : undefined}>
                <td className="px-4 py-3 flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-violet-50 text-violet-600 flex items-center justify-center"><User className="w-4 h-4" /></div>
                  <span className="font-medium text-slate-700">{p.name}</span>
                </td>
                <td className="px-4 py-3 text-slate-600 flex items-center gap-1.5"><Phone className="w-3.5 h-3.5 text-slate-400" />{p.phone}</td>
                <td className="px-4 py-3 text-right whitespace-nowrap">
                  <button onClick={() => startEdit(p)} className="text-slate-300 hover:text-violet-600 mr-2"><Pencil className="w-4 h-4" /></button>
                  <button onClick={() => remove(p.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-4 h-4" /></button>
                </td>
              </tr>
            ))}
            {people.length === 0 && (
              <tr><td colSpan={3} className="px-4 py-6 text-center text-sm text-slate-400">Belum ada data {singular.toLowerCase()}.</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <form onSubmit={submitPerson} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 h-fit">
        <p className="font-semibold text-slate-800 text-sm mb-3">{editingId ? `✎ Edit ${singular}` : `+ Tambah ${singular}`}</p>
        <div className="flex flex-col gap-3">
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder={placeholderName} className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} placeholder="No. telepon" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
          <div className="flex items-center gap-2">
            <button type="submit" className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700">
              {editingId ? <><Pencil className="w-4 h-4" /> Simpan</> : <><Plus className="w-4 h-4" /> Tambah</>}
            </button>
            {editingId && (
              <button type="button" onClick={cancelEdit} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Batal</button>
            )}
          </div>
        </div>
      </form>
    </div>
  );
}

function LaporanPage({ transactions, setTransactions, setProducts, notify }) {
  const totalOmzet = transactions.reduce((s, t) => s + t.total, 0);
  const totalQty = transactions.reduce((s, t) => s + t.qty, 0);
  const chartData = [...transactions].slice(0, 8).reverse().map((t) => ({ name: t.id.slice(-3), total: t.total }));

  const voidTransaction = (t) => {
    if (!window.confirm(`Batalkan transaksi ${t.id}? Stok produk terkait akan dikembalikan.`)) return;
    if (t.items && t.items.length) {
      setProducts((ps) => ps.map((p) => {
        const it = t.items.find((i) => i.id === p.id);
        return it ? { ...p, stock: p.stock + it.qty } : p;
      }));
    }
    setTransactions((ts) => ts.filter((x) => x.id !== t.id));
    notify(`Transaksi ${t.id} dibatalkan`);

  return (
    <div className="flex flex-col gap-4">

function PengaturanPage({ settings, setSettings, notify, products, setProducts, transactions, setTransactions, customers, setCustomers, suppliers, setSuppliers }) {
  const fileRef = useRef(null);
  const importRef = useRef(null);
  const save = (e) => { e.preventDefault(); notify("Pengaturan tersimpan"); };

  const exportData = () => {
    const payload = { products, transactions, customers, suppliers, settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `jawara-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    notify("Data berhasil diekspor");
  };

  const triggerImport = () => importRef.current?.click();

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.products)) setProducts(data.products);
        if (Array.isArray(data.transactions)) setTransactions(data.transactions);
        if (Array.isArray(data.customers)) setCustomers(data.customers);
        if (Array.isArray(data.suppliers)) setSuppliers(data.suppliers);
        if (data.settings) setSettings(data.settings);
        notify("Data berhasil diimpor");
      } catch (err) {
        notify("Gagal membaca file impor — pastikan file JSON valid");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const resetAllData = () => {
    if (!window.confirm("Reset semua data (produk, transaksi, pelanggan, supplier, pengaturan) ke kondisi awal? Tindakan ini tidak bisa dibatalkan.")) return;
    ["jawara_products", "jawara_transactions", "jawara_customers", "jawara_suppliers", "jawara_settings"].forEach((k) => window.localStorage.removeItem(k));
    window.location.reload();
  };

  const handleLogoPick = () => fileRef.current?.click();

  const handleLogoChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { notify("File harus berupa gambar"); return; }
    if (file.size > 2 * 1024 * 1024) { notify("Ukuran logo maksimal 2MB"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      setSettings((s) => ({ ...s, logoUrl: reader.result }));
      notify("Logo berhasil diperbarui");
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const removeLogo = () => { setSettings((s) => ({ ...s, logoUrl: "" })); notify("Logo dikembalikan ke default"); };

  return (
    <form onSubmit={save} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 max-w-lg flex flex-col gap-4">
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">Logo Toko</label>
        <div className="flex items-center gap-3">
          {settings.logoUrl ? (
            <img src={settings.logoUrl} alt="Logo toko" className="w-14 h-14 rounded-xl object-cover border border-slate-200" />
          ) : (
            <div className="w-14 h-14 rounded-xl bg-gradient-to-br from-violet-600 to-violet-800 flex items-center justify-center">
              <Boxes className="w-6 h-6 text-white" />
            </div>
          )}
          <div className="flex flex-col gap-1.5">
            <button type="button" onClick={handleLogoPick} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
              <Upload className="w-3.5 h-3.5" /> Ganti Logo
            </button>
            {settings.logoUrl && (
              <button type="button" onClick={removeLogo} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-500 hover:bg-rose-50">
                <RotateCcw className="w-3.5 h-3.5" /> Kembalikan Default
              </button>
            )}
          </div>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleLogoChange} className="hidden" />
        </div>
        <p className="text-[11px] text-slate-400 mt-1.5">PNG/JPG, maksimal 2MB. Logo tampil di sidebar, halaman masuk, dan invoice.</p>
      </div>
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">Nama Toko</label>
        <input value={settings.storeName} onChange={(e) => setSettings({ ...settings, storeName: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400" />
      </div>
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">Alamat</label>
        <input value={settings.address} onChange={(e) => setSettings({ ...settings, address: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400" />
      </div>
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">No. Telepon</label>
        <input value={settings.phone} onChange={(e) => setSettings({ ...settings, phone: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400" />
      </div>
      <div className="flex items-center justify-between border border-slate-100 rounded-lg px-3 py-2.5">
        <span className="text-sm text-slate-600">Cetak struk otomatis</span>
        <button type="button" onClick={() => setSettings({ ...settings, autoprint: !settings.autoprint })} className={`w-10 h-6 rounded-full transition-colors relative ${settings.autoprint ? "bg-violet-600" : "bg-slate-200"}`}>
          <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full transition-transform ${settings.autoprint ? "translate-x-4" : "translate-x-0.5"}`} />
        </button>
      </div>
      <button type="submit" className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700 w-fit">Simpan Pengaturan</button>

      <div className="border-t border-slate-100 pt-4 mt-1 flex flex-col gap-2">
        <p className="text-xs font-medium text-slate-600">Cadangan Data</p>
        <p className="text-[11px] text-slate-400">Semua data (produk, transaksi, pelanggan, supplier) tersimpan otomatis di browser ini (localStorage) — tidak tersinkron antar perangkat. Ekspor untuk cadangan, impor untuk memindahkan ke perangkat lain.</p>
        <div className="flex flex-wrap gap-2">
          <button type="button" onClick={exportData} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <Download className="w-3.5 h-3.5" /> Ekspor Data (JSON)
          </button>
          <button type="button" onClick={triggerImport} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <Upload className="w-3.5 h-3.5" /> Impor Data (JSON)
          </button>
          <button type="button" onClick={resetAllData} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-rose-200 text-rose-600 text-xs font-semibold hover:bg-rose-50">
            <RotateCcw className="w-3.5 h-3.5" /> Reset Semua Data
          </button>
        </div>
        <input ref={importRef} type="file" accept="application/json" onChange={importData} className="hidden" />
      </div>
    </form>
  );
}

function DashboardPage({ onLogout, settings, setSettings }) {
  const [active, setActive] = useState("Dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  // Persisted to localStorage so data survives refreshes and logout/login,
  // since this is a static, backend-less app.
  const [products, setProducts] = useLocalStorageState("jawara_products", initialProducts);
  const [transactions, setTransactions] = useLocalStorageState("jawara_transactions", initialTransactions);
  const [customers, setCustomers] = useLocalStorageState("jawara_customers", initialCustomers);
  const [suppliers, setSuppliers] = useLocalStorageState("jawara_suppliers", initialSuppliers);
  const [toast, setToast] = useState("");

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2800); };

  const pageContent = useMemo(() => {
    switch (active) {
      case "Dashboard": return <DashboardHome products={products} transactions={transactions} setActive={setActive} />;
      case "Penjualan": return <PenjualanPage products={products} setProducts={setProducts} transactions={transactions} setTransactions={setTransactions} notify={notify} settings={settings} />;
      case "Produk": return <ProdukPage products={products} setProducts={setProducts} notify={notify} />;
      case "Stok": return <StokPage products={products} setProducts={setProducts} />;
      case "Barcode": return <BarcodePage products={products} />;
      case "Pelanggan": return <PeopleTable title="Pelanggan" people={customers} setPeople={setCustomers} notify={notify} placeholderName="Nama pelanggan" />;
      case "Supplier": return <PeopleTable title="Supplier" people={suppliers} setPeople={setSuppliers} notify={notify} placeholderName="Nama supplier" />;
      case "Laporan": return <LaporanPage transactions={transactions} setTransactions={setTransactions} setProducts={setProducts} notify={notify} />;
      case "Pengaturan": return (
        <PengaturanPage
          settings={settings} setSettings={setSettings} notify={notify}
          products={products} setProducts={setProducts}
          transactions={transactions} setTransactions={setTransactions}
          customers={customers} setCustomers={setCustomers}
          suppliers={suppliers} setSuppliers={setSuppliers}
        />
      );
      default: return null;
    }
  }, [active, products, transactions, customers, suppliers, settings]);

  return (
    <div className="min-h-screen bg-slate-50 flex text-slate-900">
      <aside className={`fixed lg:static z-40 inset-y-0 left-0 w-64 bg-white border-r border-slate-100 flex flex-col transition-transform ${sidebarOpen ? "translate-x-0" : "-translate-x-full lg:translate-x-0"}`}>
        <div className="h-16 flex items-center px-5 border-b border-slate-100 justify-between">
          <Logo logoUrl={settings.logoUrl} />
          <button className="lg:hidden" onClick={() => setSidebarOpen(false)}><X className="w-5 h-5" /></button>
        </div>
        <nav className="flex-1 px-3 py-4 flex flex-col gap-1 overflow-y-auto">
          {navItems.map((item) => (
            <button key={item.label} onClick={() => { setActive(item.label); setSidebarOpen(false); }} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-left ${active === item.label ? "bg-violet-50 text-violet-600" : "text-slate-500 hover:bg-slate-50"}`}>
              <item.icon className="w-4 h-4" />
              {item.label}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-slate-100 flex flex-col gap-2">
          <button onClick={onLogout} className="w-full inline-flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-rose-500 px-3 py-2">
            <LogOut className="w-3.5 h-3.5" /> Keluar
          </button>
          <CopyrightFooter className="text-center text-[10px] text-slate-300 px-3" />
        </div>
      </aside>

      {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

      <div className="flex-1 min-w-0">
        <header className="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-4 sm:px-6 gap-3 sticky top-0 z-20">
          <div className="flex items-center gap-3 flex-1">
            <button className="lg:hidden" onClick={() => setSidebarOpen(true)}><Menu className="w-5 h-5" /></button>
            <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-400 max-w-sm flex-1">
              <Search className="w-4 h-4" /> Cari menu...
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-full bg-violet-100 flex items-center justify-center"><User className="w-4 h-4 text-violet-600" /></div>
            <div className="hidden sm:block text-sm">
              <p className="text-xs text-slate-400 leading-none">Kasir</p>
              <p className="font-semibold text-slate-800 leading-tight">Desta Riani</p>
            </div>
          </div>
        </header>

        <main className="p-4 sm:p-6">
          <h1 className="text-xl font-bold text-slate-900 mb-4">{active}</h1>
          {pageContent}
        </main>
      </div>

      <Toast message={toast} />
    </div>
  );
}

// ---------------- App root ----------------
export default function App() {
  const [page, setPage] = useState("landing"); // landing | login | dashboard
  const [settings, setSettings] = useLocalStorageState("jawara_settings", defaultSettings);

  if (page === "login") return <LoginPage onLogin={() => setPage("dashboard")} onBack={() => setPage("landing")} settings={settings} />;
  if (page === "dashboard") return <DashboardPage onLogout={() => setPage("login")} settings={settings} setSettings={setSettings} />;
  return <LandingPage onLogin={() => setPage("login")} settings={settings} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
