<!-- Map bare module specifiers used by the app to CDN ESM builds, so the
     browser's native module loader can resolve `import ... from "react"`
     etc. without any bundler. react-dom/lucide-react/recharts are marked
     external=react(+react-dom) so they all share this single React copy. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "jspdf": "https://esm.sh/jspdf@2.5.2",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2?external=jspdf"
  }
}
</script>

  /* Lightweight animated line-art: SVG path drawing via dash offset. */

  /* =========================================================
     v10 — dark-theme readability + remove stray white lines
     ========================================================= */

  /* Dark theme: keep sidebar/topbar logo and labels readable */
  body[data-jawara-theme="dark"] .jawara-sidebar,
  body[data-jawara-theme="dark"] .jawara-topbar {
    color: var(--jw-text) !important;
  }

  body[data-jawara-theme="dark"] .jawara-sidebar .font-display,
  body[data-jawara-theme="dark"] .jawara-sidebar .jawara-sidebar-brand-text,
  body[data-jawara-theme="dark"] .jawara-sidebar .jawara-nav-label,
  body[data-jawara-theme="dark"] .jawara-topbar .font-semibold,
  body[data-jawara-theme="dark"] .jawara-topbar .text-slate-800,
  body[data-jawara-theme="dark"] .jawara-topbar .text-slate-700 {
    color: #F8FAFC !important;
  }

  body[data-jawara-theme="dark"] .jawara-sidebar .text-slate-500,
  body[data-jawara-theme="dark"] .jawara-sidebar .text-slate-400,
  body[data-jawara-theme="dark"] .jawara-topbar .text-slate-500,
  body[data-jawara-theme="dark"] .jawara-topbar .text-slate-400 {
    color: #94A3B8 !important;
  }

  /* Preserve the JAWARA mark itself in dark mode */
  body[data-jawara-theme="dark"] .jawara-sidebar .jawara-brand-mark,
  body[data-jawara-theme="dark"] .jawara-topbar .jawara-brand-mark {
    background: #FFFFFF !important;
    border-color: rgba(255,255,255,.9) !important;
  }

  body[data-jawara-theme="dark"] .jawara-sidebar .jawara-brand-mark::before,
  body[data-jawara-theme="dark"] .jawara-topbar .jawara-brand-mark::before {
    color: #5B34E6 !important;
  }

  /* Active menu should stay obvious on dark */
  body[data-jawara-theme="dark"] .jawara-sidebar nav button.bg-violet-50,
  body[data-jawara-theme="dark"] .jawara-sidebar nav button[class*="bg-violet"] {
    background: #2B2242 !important;
    color: #FFFFFF !important;
  }

  body[data-jawara-theme="dark"] .jawara-sidebar nav button.bg-violet-50 svg,
  body[data-jawara-theme="dark"] .jawara-sidebar nav button[class*="bg-violet"] svg {
    color: #C4B5FD !important;
  }

  /* Theme select itself must not become white-on-white */
  body[data-jawara-theme="dark"] .jw-theme-select {
    background: #171A22 !important;
    color: #F8FAFC !important;
    border-color: #313949 !important;
  }

  /* Remove unintended thin white line on landing/footer boundary */
  .jw-footer-safe-brand,
  .jw-footer,
  footer {
    border-top: 0 !important;
    outline: 0 !important;
    box-shadow: none;
  }

  .jw-footer-safe-brand::before,
  .jw-footer-safe-brand::after,
  .jw-footer::before,
  .jw-footer::after {
    display: none !important;
  }

  /* Section divider must not draw over footer/contact area */
  #kontak.jw-section + footer::before,
  footer.jw-section::before {
    display: none !important;
  }

  /* Remove the white hairline appearing at login edges */
  .bg-ink {
    border: 0 !important;
    outline: 0 !important;
    box-shadow: none !important;
  }

  .bg-ink::before,
  .bg-ink::after {
    display: none !important;
  }

  /* Login card: use a soft dark separator instead of any bright edge */
  .bg-ink > div.relative,
  .bg-ink .bg-nota-paper {
    border-color: rgba(255,255,255,.08) !important;
  }

  /* Avoid 1px viewport seam caused by transforms/antialiasing */
  body,
  #root,
  .jw-footer-safe-brand,
  .bg-ink {
    background-clip: padding-box;
  }

  /* Footer brand text should always be visibly contrasted */
  .jw-footer-safe-brand .footer-jawara {
    color: #FFFFFF !important;
    text-shadow: none !important;
  }

  .jw-footer-safe-brand .footer-jawara span {
    color: #FFC83D !important;
  }


  /* v11 — eliminate white/off-white area below login on tall/mobile/tablet viewports */
  html, body, #root {
    min-height: 100%;
    margin: 0;
  }

  /* Login screen must always paint through the entire visual viewport */
  #root > .bg-ink {
    min-height: 100vh !important;
    min-height: 100dvh !important;
    width: 100%;
    background-color: #1b1714 !important;
  }

  /* iOS/iPad overscroll should reveal the same login background, not white */
  html:has(#root > .bg-ink),
  body:has(#root > .bg-ink),
  #root:has(> .bg-ink) {
    background: #1b1714 !important;
  }

  @supports (-webkit-touch-callout: none) {
    #root > .bg-ink {
      min-height: -webkit-fill-available !important;
    }
  }

function fileToResizedDataURL(file, maxDim = 480, quality = 0.82) {

    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error("Gagal membaca file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Gagal memuat gambar"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * maxDim / width);
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round(width * maxDim / height);
          height = maxDim;

      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Reads an uploaded .xlsx of products -> { products, errors }. Barcode
// column is optional; rows missing it get one generated on import, just
// like Tambah Produk does for a brand-new product.
function parseProductsExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const parsed = [];
        const errors = [];
        rows.forEach((row, i) => {
          const name = String(row["Nama Produk"] ?? row["Nama"] ?? "").trim();
          const price = Number(row["Harga"] ?? row["Price"]);
          const stock = Number(row["Stok"] ?? row["Stock"]);
          const barcode = String(row["Barcode"] ?? "").trim();
          if (!name || !isFinite(price) || price < 0 || !isFinite(stock) || stock < 0) {
            errors.push(`Baris ${i + 2}: data tidak lengkap/valid (butuh Nama Produk, Harga, Stok).`);
            return;
          }
          parsed.push({ name, price, stock, barcode });
        });
        resolve({ products: parsed, errors });
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.readAsArrayBuffer(file);
  });
}

function computeMonthlyReport(transactions, monthStr, storeName) {
  const txs = transactions.filter((t) => (t.dateKey || "").startsWith(monthStr));
  const totalOmzet = txs.reduce((s, t) => s + t.total, 0);
  const totalQty = txs.reduce((s, t) => s + (t.qty || 0), 0);
  const methodMap = {};
  txs.forEach((t) => {
    const key = t.paymentLabel || "Lainnya";
    if (!methodMap[key]) methodMap[key] = { label: key, total: 0, count: 0 };
    methodMap[key].total += t.total;
    methodMap[key].count += 1;
  });
  const byMethod = Object.values(methodMap).sort((a, b) => b.total - a.total);
  const [year, month] = monthStr.split("-").map(Number);
  const monthLabel = new Date(year, (month || 1) - 1, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  return {
    monthStr, monthLabel, storeName,
    txs: [...txs].sort((a, b) => (a.dateKey || "").localeCompare(b.dateKey || "")),
    totalOmzet, totalQty, totalTx: txs.length, byMethod,
  };
}

function exportMonthlyReportExcel(report) {
  const summaryRows = [
    { Keterangan: "Toko", Nilai: report.storeName },
    { Keterangan: "Periode", Nilai: report.monthLabel },
    { Keterangan: "Total Omzet (Rp)", Nilai: report.totalOmzet },
    { Keterangan: "Total Transaksi", Nilai: report.totalTx },
    { Keterangan: "Produk Terjual", Nilai: report.totalQty },
    { Keterangan: "", Nilai: "" },
    { Keterangan: "Per Metode Pembayaran", Nilai: "Total (Rp)" },
    ...report.byMethod.map((m) => ({ Keterangan: `${m.label} (${m.count}x)`, Nilai: m.total })),
  ];
  const wsSummary = XLSX.utils.json_to_sheet(summaryRows, { skipHeader: true });
  wsSummary["!cols"] = [{ wch: 26 }, { wch: 20 }];

  const txRows = report.txs.map((t) => ({
    "No. Invoice": t.id,
    "Waktu": t.time,
    "Metode": t.paymentLabel || "-",
    "Qty": t.qty,
    "Total (Rp)": t.total,
  }));
  const wsTx = XLSX.utils.json_to_sheet(txRows);
  wsTx["!cols"] = [{ wch: 20 }, { wch: 24 }, { wch: 14 }, { wch: 8 }, { wch: 14 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, "Ringkasan");
  XLSX.utils.book_append_sheet(wb, wsTx, "Transaksi");
  downloadWorkbook(wb, `laporan-keuangan-${report.monthStr}.xlsx`);
}

    startY: 32,
    head: [["Ringkasan", "Nilai"]],
    body: [
      ["Total Omzet", rupiah(report.totalOmzet)],
      ["Total Transaksi", String(report.totalTx)],
      ["Produk Terjual", String(report.totalQty)],

    ],
    theme: "grid",
    headStyles: { fillColor: [124, 58, 237] },

    theme: "striped",
    headStyles: { fillColor: [124, 58, 237] },
    styles: { fontSize: 8 },
