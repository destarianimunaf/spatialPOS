function PengaturanPage({ settings, setSettings, notify, products, setProducts, transactions, setTransactions, customers, setCustomers, suppliers, setSuppliers, role }) {
  const fileRef = useRef(null);
  const importRef = useRef(null);
  const [newCode, setNewCode] = useState({ code: "", percent: "" });
  const save = (e) => { e.preventDefault(); notify("Pengaturan tersimpan"); };

  // Discount codes, PPN and member discount are Super Admin-only levers —
  // they apply automatically to every transaction rung up in Penjualan.
  const addDiscountCode = (e) => {
    e.preventDefault();
    const code = newCode.code.trim().toUpperCase();
    const percent = Number(newCode.percent);
    if (!code || !percent || percent <= 0) return;
    if ((settings.discountCodes || []).some((d) => d.code.toUpperCase() === code)) {
      notify("Kode diskon sudah ada");
      return;
    }
    setSettings((s) => ({ ...s, discountCodes: [...(s.discountCodes || []), { code, percent, active: true }] }));
    setNewCode({ code: "", percent: "" });
    notify(`Kode diskon ${code} ditambahkan`);
  };

  const toggleDiscountCode = (code) => {
    setSettings((s) => ({ ...s, discountCodes: (s.discountCodes || []).map((d) => (d.code === code ? { ...d, active: !d.active } : d)) }));
  };

  const removeDiscountCode = (code) => {
    setSettings((s) => ({ ...s, discountCodes: (s.discountCodes || []).filter((d) => d.code !== code) }));
    notify(`Kode diskon ${code} dihapus`);
  };

  const exportData = () => {
    const payload = { products, transactions, customers, suppliers, settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `jawara-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    notify("Data berhasil diekspor");
  };

  const triggerImport = () => importRef.current?.click();

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.products)) setProducts(data.products);
        if (Array.isArray(data.transactions)) setTransactions(data.transactions);
        if (Array.isArray(data.customers)) setCustomers(data.customers);
        if (Array.isArray(data.suppliers)) setSuppliers(data.suppliers);
        if (data.settings) setSettings(data.settings);
        notify("Data berhasil diimpor");
      } catch (err) {
        notify("Gagal membaca file impor — pastikan file JSON valid");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const resetAllData = () => {
    if (!window.confirm("Reset semua data (produk, transaksi, pelanggan, supplier, pengaturan) ke kondisi awal? Tindakan ini tidak bisa dibatalkan.")) return;
    ["jawara_products", "jawara_transactions", "jawara_customers", "jawara_suppliers", "jawara_settings", "jawara_accounts"].forEach((k) => window.localStorage.removeItem(k));
    window.location.reload();
  };

  const handleLogoPick = () => fileRef.current?.click();

  const handleLogoChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { notify("File harus berupa gambar"); return; }
    if (file.size > 2 * 1024 * 1024) { notify("Ukuran logo maksimal 2MB"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      setSettings((s) => ({ ...s, logoUrl: reader.result }));
      notify("Logo berhasil diperbarui");
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const removeLogo = () => { setSettings((s) => ({ ...s, logoUrl: "" })); notify("Logo dikembalikan ke default"); };

  return (
    <form onSubmit={save} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 max-w-lg flex flex-col gap-4">
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">Logo Toko</label>
        <div className="flex items-center gap-3">
          {settings.logoUrl ? (
            <img src={settings.logoUrl} alt="Logo toko" className="w-14 h-14 rounded-xl object-cover border border-slate-200" />
          ) : (
            <div className="w-14 h-14 rounded-xl bg-gradient-to-br from-violet-600 to-violet-800 flex items-center justify-center">
              <Boxes className="w-6 h-6 text-white" />
            </div>
          )}
          <div className="flex flex-col gap-1.5">
            <button type="button" onClick={handleLogoPick} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
              <Upload className="w-3.5 h-3.5" /> Ganti Logo
            </button>
            {settings.logoUrl && (
              <button type="button" onClick={removeLogo} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-500 hover:bg-rose-50">
                <RotateCcw className="w-3.5 h-3.5" /> Kembalikan Default
              </button>
            )}
          </div>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleLogoChange} className="hidden" />
        </div>
        <p className="text-[11px] text-slate-400 mt-1.5">PNG/JPG, maksimal 2MB. Logo tampil di sidebar, halaman masuk, dan invoice.</p>
      </div>
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">Nama Toko</label>
        <input value={settings.storeName} onChange={(e) => setSettings({ ...settings, storeName: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400" />
      </div>
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">Alamat</label>
        <input value={settings.address} onChange={(e) => setSettings({ ...settings, address: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400" />
      </div>
      <div>
        <label className="text-xs font-medium text-slate-600 mb-1 block">No. Telepon</label>
        <input value={settings.phone} onChange={(e) => setSettings({ ...settings, phone: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-violet-400" />
      </div>
      <div className="flex items-center justify-between border border-slate-100 rounded-lg px-3 py-2.5">
        <span className="text-sm text-slate-600">Cetak struk otomatis</span>
        <button type="button" onClick={() => setSettings({ ...settings, autoprint: !settings.autoprint })} className={`w-10 h-6 rounded-full transition-colors relative ${settings.autoprint ? "bg-violet-600" : "bg-slate-200"}`}>
          <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full transition-transform ${settings.autoprint ? "translate-x-4" : "translate-x-0.5"}`} />
        </button>
      </div>
      <button type="submit" className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700 w-fit">Simpan Pengaturan</button>

      {role === "superadmin" && (
        <div className="border-t border-slate-100 pt-4 mt-1 flex flex-col gap-3">
          <div>
            <p className="text-xs font-medium text-slate-600 flex items-center gap-1.5">
              Pajak &amp; Diskon
              <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded"><Crown className="w-3 h-3" /> Super Admin</span>
            </p>
            <p className="text-[11px] text-slate-400 mt-0.5">Berlaku otomatis untuk semua transaksi di layar Penjualan.</p>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">PPN / Pajak (%)</label>
              <input value={settings.taxPercent ?? 0} onChange={(e) => setSettings({ ...settings, taxPercent: Number(e.target.value) })} type="number" min="0" step="0.1" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">Diskon Member (%)</label>
              <input value={settings.memberDiscountPercent ?? 0} onChange={(e) => setSettings({ ...settings, memberDiscountPercent: Number(e.target.value) })} type="number" min="0" step="0.1" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            </div>
          </div>
          <p className="text-[11px] text-slate-400 -mt-1.5">Diskon member otomatis dipakai saat kasir memilih pelanggan terdaftar di Penjualan.</p>

          <div>
            <label className="text-xs font-medium text-slate-600 mb-1.5 block">Kode Diskon</label>
            <div className="flex flex-col gap-1.5 mb-2">
              {(settings.discountCodes || []).length === 0 && (
                <p className="text-xs text-slate-400">Belum ada kode diskon.</p>
              )}
              {(settings.discountCodes || []).map((d) => (
                <div key={d.code} className="flex items-center justify-between border border-slate-100 rounded-lg px-3 py-2">
                  <div>
                    <p className="text-sm font-mono font-semibold text-slate-700">{d.code}</p>
                    <p className="text-[11px] text-slate-400">Potongan {d.percent}%</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => toggleDiscountCode(d.code)} className={`text-[11px] font-semibold px-2 py-1 rounded-md ${d.active ? "bg-emerald-50 text-emerald-600" : "bg-slate-100 text-slate-400"}`}>
                      {d.active ? "Aktif" : "Nonaktif"}
                    </button>
                    <button type="button" onClick={() => removeDiscountCode(d.code)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-4 h-4" /></button>
                  </div>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <input value={newCode.code} onChange={(e) => setNewCode({ ...newCode, code: e.target.value.toUpperCase() })} placeholder="KODE" className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono outline-none focus:border-violet-400" />
              <input value={newCode.percent} onChange={(e) => setNewCode({ ...newCode, percent: e.target.value })} type="number" min="1" max="100" placeholder="%" className="w-20 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
              <button type="button" onClick={addDiscountCode} className="inline-flex items-center gap-1 px-3 py-2 rounded-lg bg-violet-600 text-white text-xs font-semibold hover:bg-violet-700"><Plus className="w-3.5 h-3.5" /> Tambah</button>
            </div>
          </div>
        </div>
      )}

      <div className="border-t border-slate-100 pt-4 mt-1 flex flex-col gap-2">
        <p className="text-xs font-medium text-slate-600">Cadangan Data</p>
        <p className="text-[11px] text-slate-400">Semua data (produk, transaksi, pelanggan, supplier) tersimpan otomatis di browser ini (localStorage) — tidak tersinkron antar perangkat. Ekspor untuk cadangan, impor untuk memindahkan ke perangkat lain.</p>
        <div className="flex flex-wrap gap-2">
          <button type="button" onClick={exportData} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <Download className="w-3.5 h-3.5" /> Ekspor Data (JSON)
          </button>
          <button type="button" onClick={triggerImport} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <Upload className="w-3.5 h-3.5" /> Impor Data (JSON)
          </button>
          <button type="button" onClick={resetAllData} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-rose-200 text-rose-600 text-xs font-semibold hover:bg-rose-50">
            <RotateCcw className="w-3.5 h-3.5" /> Reset Semua Data
          </button>
        </div>
        <input ref={importRef} type="file" accept="application/json" onChange={importData} className="hidden" />
      </div>
    </form>
  );
}

// Super Admin only: manages which store accounts on the JAWARA platform are
// paying subscribers — distinct from a single toko's own customers/suppliers.
const PLAN_OPTIONS = ["Basic", "Pro", "Premium"];

function AkunPage({ accounts, setAccounts, notify }) {
  const emptyForm = { storeName: "", owner: "", plan: "Basic", expiresAt: "", email: "", password: "" };
  const [form, setForm] = useState(emptyForm);
  const [editingId, setEditingId] = useState(null);

  const startEdit = (a) => {
    setEditingId(a.id);
    setForm({ storeName: a.storeName, owner: a.owner, plan: a.plan, expiresAt: a.expiresAt, email: a.email || "", password: a.password || "" });
  };
  const cancelEdit = () => {
    setEditingId(null);
    setForm(emptyForm);
  };

  const submitAccount = (e) => {
    e.preventDefault();
    if (!form.storeName || !form.owner || !form.expiresAt || !form.email || !form.password) {
      notify("Lengkapi nama toko, pemilik, email, kata sandi, dan tanggal berlaku");
      return;
    }
    const emailTaken = accounts.some((a) => a.id !== editingId && a.email.toLowerCase() === form.email.trim().toLowerCase());
    if (emailTaken) {
      notify("Email ini sudah dipakai akun toko lain");
      return;
    }
    if (editingId) {
      setAccounts((as) => as.map((a) => (a.id === editingId
        ? { ...a, storeName: form.storeName, owner: form.owner, plan: form.plan, expiresAt: form.expiresAt, email: form.email.trim().toLowerCase(), password: form.password }
        : a)));
      notify("Akun toko diperbarui");
      cancelEdit();
    } else {
      const email = form.email.trim().toLowerCase();
      setAccounts((as) => [...as, {
        id: "A" + Date.now(), storeName: form.storeName, owner: form.owner, plan: form.plan, status: "Trial", expiresAt: form.expiresAt,
        email, password: form.password,
        kasirEmail: "kasir@" + (email.split("@")[1] || "toko.id"), kasirPassword: form.password,
      }]);
      setForm(emptyForm);
      notify("Akun toko baru ditambahkan — login Admin siap dipakai");
    }
  };

  const toggleStatus = (id) => {
    setAccounts((as) => as.map((a) => (a.id === id ? { ...a, status: a.status === "Aktif" ? "Nonaktif" : "Aktif" } : a)));
  };

  const removeAccount = (id) => {
    if (!window.confirm("Hapus akun toko ini dari JAWARA? Toko tidak akan bisa login lagi.")) return;
    setAccounts((as) => as.filter((a) => a.id !== id));
    if (editingId === id) cancelEdit();
    notify("Akun toko dihapus");
  };

  const statusStyle = {
    Aktif: "bg-emerald-50 text-emerald-600",
    Trial: "bg-amber-50 text-amber-600",
    Nonaktif: "bg-rose-50 text-rose-600",
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="bg-violet-50 border border-violet-100 rounded-2xl p-4 flex items-start gap-3">
        <Crown className="w-5 h-5 text-violet-600 shrink-0 mt-0.5" />
        <p className="text-sm text-violet-800">Halaman ini khusus <strong>Super Admin</strong> — mengelola akun toko yang berlangganan JAWARA, terpisah dari data pelanggan/supplier milik satu toko.</p>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="text-left font-medium px-4 py-3">Toko</th>
                <th className="text-left font-medium px-4 py-3">Paket</th>
                <th className="text-left font-medium px-4 py-3">Status</th>
                <th className="text-left font-medium px-4 py-3">Berlaku s/d</th>
                <th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-50">
              {accounts.map((a) => (
                <tr key={a.id} className={editingId === a.id ? "bg-violet-50/40" : undefined}>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-lg bg-violet-50 text-violet-600 flex items-center justify-center shrink-0"><Store className="w-4 h-4" /></div>
                      <div>
                        <p className="font-medium text-slate-700">{a.storeName}</p>
                        <p className="text-xs text-slate-400">{a.owner} · {a.email}</p>
                      </div>
                    </div>
                  </td>
                  <td className="px-4 py-3 text-slate-600">{a.plan}</td>
                  <td className="px-4 py-3">
                    <button onClick={() => toggleStatus(a.id)} title="Klik untuk ubah status Aktif/Nonaktif" className={`text-xs font-medium px-2.5 py-1 rounded-full ${statusStyle[a.status]}`}>
                      {a.status}
                    </button>
                  </td>
                  <td className="px-4 py-3 text-slate-500">{a.expiresAt}</td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <button onClick={() => startEdit(a)} className="text-slate-300 hover:text-violet-600 mr-2"><Pencil className="w-4 h-4" /></button>
                    <button onClick={() => removeAccount(a.id)} className="text-slate-300 hover:text-rose-500"><Trash2 className="w-4 h-4" /></button>
                  </td>
                </tr>
              ))}
              {accounts.length === 0 && (
                <tr><td colSpan={5} className="px-4 py-6 text-center text-sm text-slate-400">Belum ada akun toko.</td></tr>
              )}
            </tbody>
          </table>
        </div>

        <form onSubmit={submitAccount} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 h-fit">
          <p className="font-semibold text-slate-800 text-sm mb-3">{editingId ? "✎ Edit Akun Toko" : "+ Tambah Akun Toko"}</p>
          <div className="flex flex-col gap-3">
            <input value={form.storeName} onChange={(e) => setForm({ ...form, storeName: e.target.value })} placeholder="Nama toko" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            <input value={form.owner} onChange={(e) => setForm({ ...form, owner: e.target.value })} placeholder="Nama pemilik" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            <input value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} type="email" placeholder="Email login Admin" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            <input value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} placeholder="Kata sandi login" className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            <select value={form.plan} onChange={(e) => setForm({ ...form, plan: e.target.value })} className="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400">
              {PLAN_OPTIONS.map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
            <div>
              <label className="text-xs font-medium text-slate-600 mb-1 block">Berlaku sampai</label>
              <input value={form.expiresAt} onChange={(e) => setForm({ ...form, expiresAt: e.target.value })} type="date" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-violet-400" />
            </div>
            <div className="flex items-center gap-2">
              <button type="submit" className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 text-white text-sm font-semibold hover:bg-violet-700">
                {editingId ? <><Pencil className="w-4 h-4" /> Simpan</> : <><Plus className="w-4 h-4" /> Tambah</>}
              </button>
              {editingId && (
                <button type="button" onClick={cancelEdit} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">Batal</button>
              )}
            </div>
          </div>
        </form>
      </div>
    </div>
  );
}

// ---------------- Dashboard shell ----------------
function DashboardPage({ onLogout, settings, setSettings, role, account }) {
  const roleInfo = ROLES[role] || ROLES.admin;
  // Super Admin has no store account (it manages the platform itself); for
  // Admin/Kasir, show who's actually logged in rather than the fixed demo name.
  const displayName = account ? (role === "kasir" ? `Kasir — ${account.storeName}` : account.owner) : roleInfo.name;
  const displayEmail = account ? (role === "kasir" ? account.kasirEmail : account.email) : roleInfo.email;
  const allowedNav = navItems.filter((item) => item.roles.includes(roleInfo.key));
  // Kasir's daily job is ringing up sales, so land them straight on
  // Penjualan instead of the analytics-heavy Dashboard.
  const [active, setActive] = useState(roleInfo.key === "kasir" ? "Penjualan" : "Dashboard");
  // Open by default on desktop, closed on mobile (drawer) — and now
  // toggleable on both, so the sidebar can be collapsed to free up screen
  // space on desktop too, not just dismissed as a mobile overlay.
  const [sidebarOpen, setSidebarOpen] = useState(() => (typeof window !== "undefined" ? window.innerWidth >= 1024 : true));
  // Persisted to localStorage so data survives refreshes and logout/login,
  // since this is a static, backend-less app.
  const [products, setProducts] = useLocalStorageState("jawara_products", initialProducts);
  const [transactions, setTransactions] = useLocalStorageState("jawara_transactions", initialTransactions);
  const [customers, setCustomers] = useLocalStorageState("jawara_customers", initialCustomers);
  const [suppliers, setSuppliers] = useLocalStorageState("jawara_suppliers", initialSuppliers);
  const [accounts, setAccounts] = useLocalStorageState("jawara_accounts", initialAccounts);
  const [toast, setToast] = useState("");

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2800); };

  // Guard: if the active page isn't permitted for this role (e.g. stale
  // state from a previous session under a different role), fall back.
  const isAllowed = allowedNav.some((item) => item.label === active);
  const safeActive = isAllowed ? active : (allowedNav[0]?.label || "Dashboard");

  const pageContent = useMemo(() => {
    switch (safeActive) {
      case "Dashboard": return <DashboardHome products={products} transactions={transactions} setActive={setActive} />;
      case "Penjualan": return <PenjualanPage products={products} setProducts={setProducts} transactions={transactions} setTransactions={setTransactions} customers={customers} notify={notify} settings={settings} />;
      case "Produk": return <ProdukPage products={products} setProducts={setProducts} notify={notify} />;
      case "Stok": return <StokPage products={products} setProducts={setProducts} />;
      case "Barcode": return <BarcodePage products={products} />;
      case "Pelanggan": return <PeopleTable title="Pelanggan" people={customers} setPeople={setCustomers} notify={notify} placeholderName="Nama pelanggan" />;
      case "Supplier": return <PeopleTable title="Supplier" people={suppliers} setPeople={setSuppliers} notify={notify} placeholderName="Nama supplier" />;
      case "Laporan": return <LaporanPage transactions={transactions} setTransactions={setTransactions} setProducts={setProducts} notify={notify} />;
      case "Kelola Akun": return <AkunPage accounts={accounts} setAccounts={setAccounts} notify={notify} />;
      case "Pengaturan": return (
        <PengaturanPage
          settings={settings} setSettings={setSettings} notify={notify}
          products={products} setProducts={setProducts}
          transactions={transactions} setTransactions={setTransactions}
          customers={customers} setCustomers={setCustomers}
          suppliers={suppliers} setSuppliers={setSuppliers}
          role={roleInfo.key}
        />
      );
      default: return null;
    }
  }, [safeActive, products, transactions, customers, suppliers, accounts, settings]);

  return (
    <div className="min-h-screen bg-slate-50 flex text-slate-900">
      <aside className={`fixed lg:static z-40 inset-y-0 left-0 w-64 bg-white border-r border-slate-100 flex flex-col transition-transform duration-200 ${sidebarOpen ? "translate-x-0" : "-translate-x-full lg:hidden"}`}>
        <div className="h-16 flex items-center px-5 border-b border-slate-100 justify-between">
          <Logo logoUrl={settings.logoUrl} />
          <button onClick={() => setSidebarOpen(false)} title="Tutup menu" className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
        </div>
        <nav className="flex-1 px-3 py-4 flex flex-col gap-1 overflow-y-auto">
          {allowedNav.map((item) => (
            <button key={item.label} onClick={() => { setActive(item.label); setSidebarOpen(false); }} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-left ${safeActive === item.label ? "bg-violet-50 text-violet-600" : "text-slate-500 hover:bg-slate-50"}`}>
              <item.icon className="w-4 h-4" />
              {item.label}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-slate-100 flex flex-col gap-2">
          <button onClick={onLogout} className="w-full inline-flex items-center justify-center gap-2 text-sm font-semibold text-rose-600 border border-rose-200 bg-rose-50 hover:bg-rose-100 rounded-lg px-3 py-2.5">
            <LogOut className="w-4 h-4" /> Keluar
          </button>
          <CopyrightFooter className="text-center text-[10px] text-slate-300 px-3" />
        </div>
      </aside>

      {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

      <div className="flex-1 min-w-0">
        <header className="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-4 sm:px-6 gap-3 sticky top-0 z-20">
          <div className="flex items-center gap-3 flex-1">
            <button onClick={() => setSidebarOpen((v) => !v)} title={sidebarOpen ? "Tutup menu" : "Buka menu"} className="text-slate-500 hover:text-slate-700"><Menu className="w-5 h-5" /></button>
            <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-400 max-w-sm flex-1">
              <Search className="w-4 h-4" /> Cari menu...
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-full bg-violet-100 flex items-center justify-center">
              {roleInfo.key === "superadmin" ? <Crown className="w-4 h-4 text-violet-600" /> : <User className="w-4 h-4 text-violet-600" />}
            </div>
            <div className="hidden sm:block text-sm" title={displayEmail || undefined}>
              <p className="text-xs text-slate-400 leading-none">{roleInfo.label}</p>
              <p className="font-semibold text-slate-800 leading-tight">{displayName}</p>
            </div>
            <button onClick={onLogout} title="Keluar" className="inline-flex items-center gap-1.5 text-xs font-semibold text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg px-2.5 py-2">
              <LogOut className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Keluar</span>
            </button>
          </div>
        </header>

        <main className="p-4 sm:p-6">
          <h1 className="text-xl font-bold text-slate-900 mb-4">{safeActive}</h1>
          {pageContent}
        </main>
      </div>

      <Toast message={toast} />
    </div>
  );
}

// ---------------- App root ----------------
export default function App() {
  const [page, setPage] = useState("landing"); // landing | login | register | dashboard | menu
  const [role, setRole] = useState("admin");
  // The real, authenticated store account behind the current session (null
  // for Super Admin, which isn't tied to any single store's subscription).
  const [account, setAccount] = useState(null);
  const [prefillEmail, setPrefillEmail] = useState("");
  const [settings, setSettings] = useLocalStorageState("jawara_settings", defaultSettings);

  const handleLogin = (loginRole, loggedInAccount) => {
    setRole(loginRole || "admin");
    setAccount(loggedInAccount || null);
    setPage("dashboard");
  };

  const handleRegistered = (email) => {
    setPrefillEmail(email);
    setPage("login");
  };

  const handleLogout = () => {
    setAccount(null);
    setPage("login");
  };

  if (page === "menu") return <MenuPage onBack={() => setPage("landing")} />;
  if (page === "register") return <RegisterPage onBack={() => setPage("landing")} onRegistered={handleRegistered} settings={settings} />;
  if (page === "login") return <LoginPage onLogin={handleLogin} onBack={() => setPage("landing")} onGoRegister={() => setPage("register")} settings={settings} prefillEmail={prefillEmail} />;
  if (page === "dashboard") return <DashboardPage onLogout={handleLogout} settings={settings} setSettings={setSettings} role={role} account={account} />;
  return <LandingPage onLogin={() => setPage("login")} onRegister={() => setPage("register")} onViewMenu={() => setPage("menu")} settings={settings} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
